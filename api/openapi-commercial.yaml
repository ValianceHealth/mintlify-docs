          application/fhir+json:
            schema:
              type: object
              additionalProperties: {}
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: Parameters
                    parameter:
                    - name: drg
                      valueString: '639'
                    - name: description
                      valueString: Diabetes without CC/MCC
                    - name: mdc
                      valueString: '10'
                    - name: grouperVersion
                      valueString: v40
                    - name: fhir_identifiers_dropped
                      valueBoolean: true
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: Parameters
                    parameter:
                    - name: drg
                      valueString: '639'
                    - name: description
                      valueString: Diabetes without CC/MCC
                    - name: mdc
                      valueString: '10'
                    - name: grouperVersion
                      valueString: v40
                    - name: fhir_identifiers_dropped
                      valueBoolean: true
          description: FHIR Parameters with the DRG result
        '400':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: invalid
                      diagnostics: 'Not a valid FHIR R4 Bundle: 1 validation error(s).'
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: invalid
                      diagnostics: 'Not a valid FHIR R4 Bundle: 1 validation error(s).'
          description: OperationOutcome — invalid or unclassifiable Bundle
        '401':
          description: Authentication required
        '403':
          description: The API key lacks the drg:classify scope, or `view_as` names an organization the
            caller may not act as
