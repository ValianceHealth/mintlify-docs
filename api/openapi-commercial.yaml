  /api/v1/llm/chat/completions:
    post:
      operationId: v1_llm_chat_completions_create
      description: "\nAn OpenAI-compatible chat completion endpoint that redacts PHI before the\nmodel\
        \ sees it and restores the real values in the answer.\n\n```python\nclient = OpenAI(base_url=\"\
        https://<host>/api/v1/llm\", api_key=\"hpx_...\")\nclient.chat.completions.create(model=\"<model>\"\
        , messages=[...])\n```\n\nPer request: your message content is redacted (Malaysian IC/MRN/passport/phone,\n\
        names, emails, account numbers — clinical content such as ages, dates like\n\"day 3 post-op\"\
        , vitals and dosages is preserved), the placeholders go to the\nmodel, and the model's answer\
        \ has your values substituted back. The mapping\nlives only in the request's memory and is never\
        \ stored.\n\nEvery response carries `redaction_receipt`, including `rehydration_complete`\nand\
        \ `unresolved_placeholder_count` — if the model altered our placeholders, the\nreceipt says so\
        \ rather than returning residue silently.\n\n**Tool calling** is supported: send OpenAI-style\
        \ `tools`, receive `tool_calls`\nwith your values re-hydrated. Your `tool` role results are redacted\
        \ on the way\nout like any other message, and so are the arguments of an assistant turn you\n\
        send back.\n\n**Long answers: stream them.** A non-streamed request must complete inside a\nfixed\
        \ budget, and a model that has not answered by then returns `504` with\n`error.type: \"model_timeout\"\
        ` naming the model. The GPT-5.x models are the ones\nthis reaches: their latency on an identical\
        \ prompt varies widely, measured\nbetween 1.4s and 106.2s. A streamed request is not subject to\
        \ that budget at\nall, because output arrives continuously — so for long generations send\n`stream=true`\
        \ together with `redact_only=true`.\n\n**`max_tokens` minimums.** The GPT-5.x models refuse anything\
        \ below **16** and\nthe request is rejected with `400` before it reaches the provider. Other model\n\
        families have no such floor.\n\n**Not supported** (refused, not silently dropped): streaming while\
        \ re-hydrating\n(`stream` with `redact_only=false`), tools combined with `stream`, non-text\n\
        content parts, forcing a specific tool via `tool_choice`, and the deprecated\n`functions`/`function_call`\
        \ form.\n    "
      summary: PHI-safe chat completion (OpenAI-compatible)
      tags:
      - Gateway
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequestRequest'
        required: true
      security:
      - gateway_bearer_auth: []
      responses:
        '200':
          description: chat.completion with a redaction receipt attached
        '400':
          description: Invalid request, or model not approved
        '401':
          description: Authentication required
        '402':
          description: 'Insufficient prepaid credit (PAID tier only). The worst-case cost of the call
            -- its input plus max_tokens at the output rate -- is held before the model runs; when the
            wallet cannot cover that hold the call is refused here and nothing is charged. Top up and
            retry. Deliberately NOT 401 (the key is valid) and NOT 429 (nothing is rate limited): an SDK
            that retries a 429 would only hammer a wallet that needs money. `available_minor` is in the
            wallet''s own minor units.'
        '429':
          description: Rate limit or spend limit reached
        '503':
          description: Redaction failed — request refused
        '504':
          description: The model did not answer inside the budget for a non-streamed request. Retry, or
            send stream=true with redact_only=true.
