      - ATC
      type: string
      description: '* `ICD10` - ICD10

        * `ICD10CM` - ICD10CM

        * `ICD10PCS` - ICD10PCS

        * `ICD9CM` - ICD9CM

        * `ICD9Proc` - ICD9Proc

        * `SNOMED` - SNOMED

