      - CPT4
      - RxNorm
      - SNOMED
      type: string
      description: '* `ICD10CM` - ICD10CM

        * `ICD10PCS` - ICD10PCS

        * `CPT4` - CPT4

        * `RxNorm` - RxNorm

        * `SNOMED` - SNOMED'
    WorkflowRequestRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Clinical term to resolve
        vocabulary_id:
          type: string
          minLength: 1
          description: Vocabulary to resolve against (e.g., 'ICD10CM', 'SNOMED', 'RxNorm')
        domain_id:
          type: string
          minLength: 1
          description: Filter by domain (e.g., 'Condition')
        top_k:
          type: integer
          maximum: 100
          minimum: 1
          nullable: true
          description: Override per-pass top_k from the strategy (1-100)
        include_mappings:
          type: boolean
          default: false
          description: Include cross-vocabulary mappings for each match
        target_vocabularies:
          type: array
          items:
            type: string
            minLength: 1
          description: Target vocabularies for mappings (e.g., ['SNOMED', 'ICD10CM'])
      required:
      - query
      - vocabulary_id
    WorkflowResponse:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/WorkflowResults'
        metadata:
          type: object
          additionalProperties: {}
      required:
      - metadata
      - results
    WorkflowResults:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
      required:
      - steps
    WorkflowStep:
      type: object
      properties:
        step:
          type: integer
        label:
          type: string
        concept_class_id:
          type: string
          nullable: true
        matches:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedConcept'
        descendants:
          type: object
          additionalProperties: {}
          nullable: true
      required:
      - concept_class_id
      - label
      - matches
      - step
  securitySchemes:
    api_key_auth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for organization authentication. Obtain from the organization settings or API
        key management endpoint.
    entra_bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Microsoft Entra ID access token (RS256) issued to the Healthproximate MCP app registration
        with the delegated `access_as_user` scope, as Microsoft 365 Copilot sends. The tenant must be
        set up for Healthproximate SSO.
    gateway_bearer_auth:
      type: http
      scheme: bearer
      description: Your hpx_ API key as a Bearer token, so OpenAI-compatible SDKs work unmodified. X-API-Key
        is also accepted. A signed-in user's JWT is refused unless the user is a superuser.
    jwt_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /login/ endpoint
tags:
- name: DRG
  description: MS-DRG classification from coded input, free clinical text, or FHIR.
- name: Pricing
  description: Expected price for a diagnosis or procedure from your organization's own claims, with a
    minimum-cell rule.
- name: FHIR Terminology
  description: FHIR R4 CodeSystem, ValueSet and ConceptMap operations over the OMOP vocabularies.
- name: Vocabulary
  description: OMOP concept search, coding, translation and hierarchy resolution.
- name: Gateway
  description: PHI-safe LLM access. Text is redacted before any model sees it and re-hydrated in the answer,
    and every response carries a receipt.
- name: Account
  description: Your own API usage and cost. Readable with any credential, including a key with no scopes
    — billing transparency is not a privilege to withhold. A key sees the requests made with that key;
    a dashboard session sees the requests made in the dashboard.
- name: MCP
  description: 'Model Context Protocol server for AI assistants (Claude Code, Codex, Cursor, Microsoft
    365 Copilot): read-only case, DRG and coding tools over JSON-RPC.'
servers:
- url: https://api.v2.healthproximate.com
