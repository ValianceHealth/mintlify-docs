  /api/v1/fhir/CodeSystem/$validate-code:
    get:
      operationId: v1_fhir_codesystem_validate_code
      description: 'Is this code valid? `result` is `false`, with a `message`, when the

        code does not exist, is deprecated, or `display` does not match the code''s name.

        An unknown code is a 200 with `result: false`, never an error.


        | Code system | `system` URI |

        |---|---|

        | ICD10CM | `http://hl7.org/fhir/sid/icd-10-cm` |

        | ICD10 | `http://hl7.org/fhir/sid/icd-10` |

        | ICD10PCS | `http://www.cms.gov/Medicare/Coding/ICD10` |

        | ICD9CM | `http://hl7.org/fhir/sid/icd-9-cm` |

        | SNOMED | `http://snomed.info/sct` |


        Send `Authorization: Bearer <token>`, where the token is a Healthproximate JWT or an `hpx_` API
        key with the `vocabulary` scope.


        **FHIR R4 spec:** [CodeSystem $validate-code](https://hl7.org/fhir/R4/codesystem-operation-validate-code.html)
        · [CodeSystem](https://hl7.org/fhir/R4/codesystem.html) · [Parameters](https://hl7.org/fhir/R4/parameters.html)
        · [OperationOutcome](https://hl7.org/fhir/R4/operationoutcome.html)'
      summary: CodeSystem $validate-code
      externalDocs:
        url: https://hl7.org/fhir/R4/codesystem-operation-validate-code.html
        description: 'HL7 FHIR R4: CodeSystem $validate-code'
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: The code, dotted or undotted (`E11.9` or `E119`).
        required: true
      - in: query
        name: display
        schema:
          type: string
        description: Optional. Checked case-insensitively against the code's name.
      - in: query
        name: system
        schema:
          type: string
        description: Code system URI (see the table above).
        required: true
      - in: query
        name: version
        schema:
          type: string
        description: Optional. Refused with 400 if it is not the loaded version.
      tags:
      - FHIR Terminology
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: Parameters
                    parameter:
                    - name: result
                      valueBoolean: false
                    - name: display
                      valueString: Type 2 diabetes mellitus without complications
                    - name: message
                      valueString: Display does not match; expected 'Type 2 diabetes mellitus without
                        complications'.
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: Parameters
                    parameter:
                    - name: result
                      valueBoolean: false
                    - name: display
                      valueString: Type 2 diabetes mellitus without complications
                    - name: message
                      valueString: Display does not match; expected 'Type 2 diabetes mellitus without
                        complications'.
          description: FHIR R4 resource (application/fhir+json)
        '400':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: not-supported
                      diagnostics: 'Code system ''http://loinc.org'' is not supported. Supported: http://hl7.org/fhir/sid/icd-10,
                        http://hl7.org/fhir/sid/icd-10-cm, http://hl7.org/fhir/sid/icd-9-cm, http://snomed.info/sct,
                        http://www.cms.gov/Medicare/Coding/ICD10.'
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
