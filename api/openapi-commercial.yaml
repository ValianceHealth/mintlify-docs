  /api/v1/omop/translate/:
    post:
      operationId: v1_omop_translate_create
      description: 'Translate a concept code from one vocabulary into another.


        Targets are restricted to vocabularies actually loaded in this OMOP install. A target that is
        not loaded — ICD-11, for example — is **refused with a 400**, never answered with an empty list:
        empty means "no equivalent exists", which is a different and wrong answer.


        Results are `Maps to` targets filtered to standard concepts in the target vocabulary, ordered
        by concept_id so the choice is deterministic. If the source code has no native concept, the curated
        crosswalk is consulted and `source.found_via` reports that.


        ICD-9-CM and ICD-10-CM/PCS have no `Maps to` between them. For those pairs (ICD10PCS ⇄ ICD9Proc,
        ICD10CM ⇄ ICD9CM) the answer comes from CMS''s 2018 General Equivalence Mappings: `metadata.mapped_via`
        is `cms_gem_2018`, every GEM target is returned (one code can map to several, and they need not
        be standard concepts), and each result''s `gem_flags` says whether the match is exact, approximate
        or part of a combination.


        **Supports both JWT (Authorization: Bearer) and API key (X-API-Key) authentication.**'
      summary: Translate a concept between vocabularies (API)
      parameters:
      - in: query
        name: response_format
        schema:
          type: string
          enum:
          - json
          - llm
          default: json
        description: Response format. 'json' (default) returns structured JSON. 'llm' returns compact
          markdown tables (text/markdown) optimized for LLM consumption. When 'llm', the response body
          is markdown text rather than the JSON schema shown below.
      tags:
