    TargetVocabularyEnum:
      enum:
      - ICD10
      - ICD10CM
      - ICD10PCS
      - ICD9CM
      - ICD9Proc
      - SNOMED
      - CPT4
      - HCPCS
      - RxNorm
      - RxNorm Extension
      - OPCS4
      - DRG
      - LOINC
      - ICDO3
      - ATC
      type: string
      description: '* `ICD10` - ICD10

        * `ICD10CM` - ICD10CM

        * `ICD10PCS` - ICD10PCS

        * `ICD9CM` - ICD9CM

        * `ICD9Proc` - ICD9Proc

        * `SNOMED` - SNOMED

        * `CPT4` - CPT4

        * `HCPCS` - HCPCS

        * `RxNorm` - RxNorm

        * `RxNorm Extension` - RxNorm Extension

        * `OPCS4` - OPCS4

        * `DRG` - DRG

        * `LOINC` - LOINC

        * `ICDO3` - ICDO3

        * `ATC` - ATC'
    TranslateConcept:
      type: object
      properties:
        concept_id:
          type: integer
        concept_name:
          type: string
        concept_code:
          type: string
        vocabulary_id:
          type: string
        concept_class_id:
          type: string
          nullable: true
        standard_concept:
          type: string
          nullable: true
      required:
      - concept_class_id
      - concept_code
      - concept_id
      - concept_name
      - standard_concept
      - vocabulary_id
    TranslateRequestRequest:
      type: object
      description: 'Input to `/translate`.


        Both vocabularies are ChoiceFields over the LOADED partitions, so an

        unloaded target (ICD-11) is refused at validation with a 400 naming the

        supported set. That refusal is the feature: answering with an empty list

        would say "no equivalent exists", which is a different and wrong answer.'
      properties:
        concept_code:
          type: string
          minLength: 1
          description: Source concept code, e.g. 'K35.80'.
        source_vocabulary:
          allOf:
          - $ref: '#/components/schemas/SourceVocabularyEnum'
          description: 'Vocabulary the code belongs to.


            * `ICD10` - ICD10

            * `ICD10CM` - ICD10CM

            * `ICD10PCS` - ICD10PCS

            * `ICD9CM` - ICD9CM

            * `ICD9Proc` - ICD9Proc

            * `SNOMED` - SNOMED

            * `CPT4` - CPT4

            * `HCPCS` - HCPCS

            * `RxNorm` - RxNorm

            * `RxNorm Extension` - RxNorm Extension

            * `OPCS4` - OPCS4

            * `DRG` - DRG

            * `LOINC` - LOINC

            * `ICDO3` - ICDO3

            * `ATC` - ATC'
        target_vocabulary:
          allOf:
          - $ref: '#/components/schemas/TargetVocabularyEnum'
          description: 'Vocabulary to translate into. Must be loaded in this OMOP install. ICD-11 is NOT
            loaded — it exists here only as a rulebook, not a mapped vocabulary — so it is refused rather
            than answered with nothing.


            * `ICD10` - ICD10

            * `ICD10CM` - ICD10CM

            * `ICD10PCS` - ICD10PCS

            * `ICD9CM` - ICD9CM

            * `ICD9Proc` - ICD9Proc

            * `SNOMED` - SNOMED

            * `CPT4` - CPT4

            * `HCPCS` - HCPCS

            * `RxNorm` - RxNorm

            * `RxNorm Extension` - RxNorm Extension

            * `OPCS4` - OPCS4

            * `DRG` - DRG

            * `LOINC` - LOINC

            * `ICDO3` - ICDO3

            * `ATC` - ATC'
      required:
      - concept_code
      - source_vocabulary
      - target_vocabulary
    TranslateResponse:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/TranslateSource'
        results:
          type: array
          items:
            $ref: '#/components/schemas/TranslateConcept'
        metadata:
          type: object
          additionalProperties: {}
      required:
      - metadata
      - results
      - source
    TranslateSource:
      type: object
      description: 'What was asked for, and what it resolved to — kept apart.


        On a curated-crosswalk hit these MAY differ. The curated map takes WHO

        ICD-10 source codes to ICD-10-CM concepts

        (`crosswalk_writer.TARGET_VOCABULARY`), so a caller who named `ICD10`

        gets back an `ICD10CM` concept, while a caller who named `ICD10CM` gets

        one in the vocabulary they asked for.


        Because it is "may" and not "always", nothing may assume a difference —

        compare the two fields. A flat payload invited callers to read the

        resolved concept as the thing they asked about, which is the error this

        split exists to prevent.'
      properties:
        requested_code:
          type: string
          description: The code the caller sent, verbatim.
        requested_vocabulary:
          type: string
          description: The vocabulary the caller said the code belongs to.
        found_via:
          type: string
          description: '''concept'' when the requested code is a native OMOP concept, ''curated_crosswalk''
            when it was resolved through the curated local mapping table (WHO ICD-10 source codes to ICD-10-CM
            concepts). On ''curated_crosswalk'', `resolved_concept` is the mapped concept, which MAY be
            in a different vocabulary from `requested_vocabulary` — compare the two rather than assuming.'
        resolved_concept:
          allOf:
          - $ref: '#/components/schemas/TranslateConcept'
          description: The OMOP concept the request resolved to, whichever route found it.
      required:
      - found_via
      - requested_code
      - requested_vocabulary
      - resolved_concept
    Ub04DischargeStatusEnum:
