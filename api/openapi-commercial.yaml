      description: 'Resolve free text to concepts in one vocabulary.


        Retrieval routing (graph vs hybrid, and whether to narrow by OMOP domain) is chosen from the vocabulary
        capability registry, so callers do not need to know it. The `routing` block in every response
        reports what was chosen and the `evidence` behind it.


        Vocabularies whose routing has never been benchmarked are **served, not refused** — the response
        carries `measured: false` and a `caveat`.


