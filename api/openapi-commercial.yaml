        '401':
          description: Invalid or missing authentication. Provide either Authorization header (Bearer
            token) or X-API-Key header.
  /api/v1/predict/price/:
    post:
      operationId: v1_predict_price_create
      description: "\nThe expected price of a diagnosis (by ICD-10 code) or a procedure (by id), from\
        \ your\norganization's own claims, with a range and the number of cases behind it.\n\n**Whose\
        \ data.** A key answers for its own organization only. A `view_as` naming another\norganization\
        \ is refused with 403. Nothing from any other organization is used: where\nyour own history is\
        \ too thin the answer is `insufficient_data`.\n\n**One organization.** `view_as` naming more than\
        \ one organization is refused with 400\n`single_organization_required`.\n\n**Minimum cell.** A\
        \ figure is returned only when at least 20 of your cases from at least\n5 different providers\
        \ stand behind it, with no single provider more than 25% of the\ncases. Below that the body is\
        \ `insufficient_data` with a null `point`, `interval`,\n`case_count`, `basis` and `breakdown`;\
        \ a count below the threshold is never returned, so\n0 cases and 19 cases look the same. `case_count`\
        \ is your organization's own usable\ncases for the code in the window, rounded down to the nearest\
        \ 10; it is not the number of\ncases a model was trained on. A model answer that found no similar\
        \ cases is\n`insufficient_data` too. `basis.window_months` is the rolling admission window the\
        \ cases are drawn\nfrom. Figures from a model trained on a group of organizations are `insufficient_data`.\n\
        \n**Payor-bound keys.** A key can be bound to one insurer by your account manager. Its\nmodel\
        \ answers are then fed that insurer; `payor_id`, if sent, must be the insurer's own id\n(its payor\
        \ organization id), and any other is refused with 403 `payor_not_permitted`. A\nbound key may\
        \ also send `provider_id`, `surgeon_id` and `client_id`, each an id\n`GET /api/v1/predict/price/options/`\
        \ lists for the concept; any other id, whether it\nexists elsewhere, is below the floor below,\
        \ or exists nowhere, is 403\n`entity_not_permitted` (the same body for each).\n\n**The entity\
        \ floor.** A provider, surgeon or client moves a model figure through what the\nmodel learned\
        \ from every insurer's claims at it. So an entity is offered and accepted\nonly when your organization's\
        \ usable claims at it, over every diagnosis and procedure,\ncome from at least 3 insurers and\
        \ number at least 15; or when every one of those claims\nis the key's own insurer's (a claim whose\
        \ insurer is unknown breaks that). Below it, one\nor two other insurers' prices could be read\
        \ back out of the figure.\n\n**What a model figure is learned from.** The model is trained on\
        \ ALL of your\norganization's claims, every insurer's. A bound key's insurer, provider, surgeon\
        \ and\nclient CONDITION that model (the figure is what the model expects for those inputs); they\n\
        do not restrict the figure to the insurer's own claims, and `case_count` is your\norganization's\
        \ cases for the concept, not the insurer's.\n\n**`inputs_applied`.** The inputs the figure was\
        \ computed for (`client`, `payor`,\n`provider`, `surgeon`, sorted): only the ones the model recognized\
        \ from its training data.\nAn input the model never saw (an insurer, provider, surgeon or client\
        \ with no claims in\nits training data, or one added since it was trained) is not applied and\
        \ not listed: the\nfigure is then the one for \"not specified\". `payor_applied` is `\"payor\"\
        \ in\ninputs_applied`. Own-history figures (`basis.result_kind` is `own_history_range`) are your\n\
        organization's claims across all payors and entities, so `inputs_applied` is `[]` and\n`payor_applied`\
        \ is `false` for them, as for `insufficient_data`.\n\n**Unbound keys.** Any other key (and a user\
        \ login) is pooled and anonymised: it must not\nsend `payor_id` (400 `payor_id_not_accepted`)\
        \ or `provider_id`, `surgeon_id`, `client_id`\n(400 `entity_not_accepted`), and its `inputs_applied`\
        \ is always `[]`.\n\n**Concept.** For `domain=condition` send either `code` (an ICD-10 code; only\
        \ its\n3-character category is used, and that category is the same in ICD-10 and ICD-10-CM) or\n\
        `concept_id`. The answer uses the vocabulary your organization's claims are coded in;\n`concept.vocabulary`\
        \ in the response says which, and `vocabulary` in the request is\noptional and does not change\
        \ it. For `domain=procedure` send `concept_id` (the procedure\nid): procedure codes are not looked\
        \ up. `GET /api/v1/predict/price/concepts/` lists the\nconcepts whose claims meet the minimum\
        \ cell, with their `concept_id`.\n\n**Access.** Every API key needs the `predict:price` scope\
        \ (a key with no scopes is\nrefused), and the organization must have the\nprice prediction API\
        \ enabled (403 `feature_not_enabled` otherwise).\n    "
      summary: Expected price for a diagnosis or procedure
      tags:
      - Pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricePredictRequestRequest'
            examples:
              DiagnosisByCode:
                value:
                  domain: condition
                  code: K35.80
                  age: 34
                  gender: F
                  los: 3
                summary: Diagnosis by code
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PricePredictRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PricePredictRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricePredictResponse'
              examples:
                Estimate:
                  value:
                    result: estimate
                    metric: price
                    currency: MYR
                    payor_applied: false
                    inputs_applied: []
                    concept:
                      domain: condition
                      concept_id: 4213
                      code: K35
                      vocabulary: ICD10CM
                    point: 8450.0
                    interval:
                      low: 6100.0
                      high: 12900.0
                      coverage: 0.9
                    case_count: 210
                    basis:
                      result_kind: model
                      method: trained_model
                      tier: info
                      reasons: []
                      label: null
                      window_months: 24
                    breakdown:
                    - group: Room & board
                      amount: 2900.0
                    - group: Others
                      amount: 410.0
                EstimateForAPayor-boundKey'sInputs:
                  value:
                    result: estimate
                    metric: price
                    currency: MYR
                    payor_applied: true
                    inputs_applied:
                    - payor
                    - provider
                    - surgeon
                    concept:
                      domain: condition
                      concept_id: 4213
                      code: K35
                      vocabulary: ICD10CM
                    point: 8450.0
                    interval:
                      low: 6100.0
                      high: 12900.0
                      coverage: 0.9
                    case_count: 210
                    basis:
                      result_kind: model
                      method: trained_model
                      tier: info
                      reasons: []
                      label: null
                      window_months: 24
                    breakdown:
                    - group: Room & board
                      amount: 2900.0
                    - group: Others
                      amount: 410.0
                  summary: Estimate for a payor-bound key's inputs
                InsufficientData:
                  value:
                    result: insufficient_data
                    metric: price
                    currency: MYR
                    payor_applied: false
                    inputs_applied: []
                    concept:
                      domain: condition
                      concept_id: 4213
                      code: K35
                      vocabulary: ICD10CM
                    point: null
                    interval: null
                    case_count: null
                    basis: null
                    breakdown: null
                  summary: Insufficient data
          description: An estimate, or `insufficient_data` when the minimum cell is not met.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                InvalidCode:
                  value:
                    detail: Not a valid ICD-10 code.
                    code: invalid_code
                  summary: Invalid code
                CodeOrConceptId:
                  value:
                    detail: Send exactly one of `code` (domain `condition` only) and `concept_id`.
                    code: code_or_concept_id
                  summary: Code or concept id
                InvalidConceptId:
                  value:
                    detail: Not a valid procedure id.
                    code: invalid_concept_id
                  summary: Invalid concept id
                UnknownField:
                  value:
                    detail: These fields are not accepted.
                    code: field_not_accepted
                  summary: Unknown field
                ValidationFailed:
                  value:
                    detail: Validation failed.
                    code: validation_failed
                  summary: Validation failed
                PayorFromAnUnboundKey:
                  value:
                    detail: This key is not payor-bound, so `payor_id` is not accepted.
                    code: payor_id_not_accepted
                  summary: Payor from an unbound key
                EntityFromAnUnboundKey:
                  value:
                    detail: This key is not payor-bound, so `provider_id`, `surgeon_id` and `client_id`
                      are not accepted.
                    code: entity_not_accepted
                  summary: Entity from an unbound key
                SeveralOrganizations:
                  value:
                    detail: Name exactly one organization in `view_as`.
                    code: single_organization_required
                  summary: Several organizations
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
                    code: not_authenticated
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                NotEnabled:
                  value:
                    detail: Price prediction is not enabled for this organization.
                    code: feature_not_enabled
                  summary: Not enabled
                ScopeMissing:
                  value:
                    detail: This API key's scopes do not cover this endpoint.
                    code: permission_denied
                  summary: Scope missing
                NoOrganization:
                  value:
                    detail: This caller has no acting organization.
                    code: organization_required
                  summary: No organization
                AnotherPayor:
                  value:
                    detail: This key may only answer for its own payor.
                    code: payor_not_permitted
                  summary: Another payor
                EntityNotInOwnClaims:
                  value:
                    detail: This key may only name a provider, surgeon or client that `GET /api/v1/predict/price/options/`
                      lists for this concept.
                    code: entity_not_permitted
                  summary: Entity not in own claims
          description: The key lacks the scope, the feature is not enabled, the caller has no organization,
            `view_as` names another organization, `payor_id` is not the key's insurer, or a `provider_id`
            / `surgeon_id` / `client_id` is not in the key's own claims for the concept
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                UnknownCode:
                  value:
                    detail: No diagnosis category matches this code.
                    code: concept_not_found
                  summary: Unknown code
          description: No diagnosis category or procedure matches
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                InconsistentInputs:
                  value:
                    detail: One or more inputs are clinically inconsistent.
                    code: clinically_invalid_input
                  summary: Inconsistent inputs
          description: The inputs are clinically inconsistent or outside what the model accepts
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                Unavailable:
                  value:
                    detail: The price model is unavailable. Try again later.
                    code: prediction_unavailable
          description: The price model is unavailable; retry later
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 30 seconds.
                    code: throttled
          description: Rate limit or monthly request limit reached
  /api/v1/predict/price/concepts/:
    get:
      operationId: v1_predict_price_concepts_list
      description: "\nThe diagnosis categories (`domain=condition`) or procedures (`domain=procedure`)\
        \ your\norganization's claims can price: the ids `POST /api/v1/predict/price/` takes as\n`concept_id`.\
        \ A procedure is priced by id only, and this list is where its id comes from.\n\n**What is listed.**\
        \ Only the concepts whose claims meet the price endpoint's minimum cell\norganization-wide: at\
        \ least 20 of your organization's own usable claims (discharged,\npriced, not excluded, in the\
        \ rolling admission window the price endpoint draws from) from\nat least 5 providers, no provider\
        \ above 25% of them. Nothing from any other organization.\nA concept below the cell is not listed\
        \ at all, so the list never tells a concept with no\nclaims from one with a few. No counts and\
        \ no provider data are returned.\n\n**What a listing means.** A listed concept usually returns\
        \ a figure, though the inputs you\nsend (a gender, an age) can narrow the cases behind it below\
        \ the cell, and the answer is\nthen `insufficient_data`. An unlisted concept usually returns `insufficient_data`,\
        \ though\na narrower cohort (a gender, an age band) can occasionally meet the cell on its own.\n\
        \n**Rows.** A diagnosis row carries its 3-character ICD-10 `code` and the `vocabulary` your\n\
        claims are coded in; a procedure row has a null `code` and `vocabulary`. Rows are ordered\nby\
        \ `name` (case-insensitive), then `concept_id`. `search` keeps the rows whose name (or,\nfor a\
        \ diagnosis, code) contains it, ignoring case.\n\n**Paging.** `page` (default 1) and `page_size`\
        \ (default 20, clamped to 100);\na value that is not an integer of 1 or more is 400 `validation_failed`.\
        \ `total` counts the\nmatching rows over every page.\n\n**Freshness.** The list is computed once\
        \ per organization and domain. A claims load\nrefreshes it at once; otherwise it is kept for up\
        \ to an hour.\n\n**Query parameters.** Any parameter other than `domain`, `search`, `page`, `page_size`\n\
        and `view_as` is refused with 400 `field_not_accepted`, naming it in `fields`.\n\n**Access.**\
        \ The same as the price endpoint: the `predict:price` scope on every key, one\norganization in\
        \ `view_as` (400 `single_organization_required`), and the price prediction\nAPI enabled for the\
        \ organization (403 `feature_not_enabled`). Each call is recorded in\nyour request history as\
        \ `price_predict_concepts` and counts toward a monthly request limit.\n    "
      summary: Diagnoses and procedures you can price
      parameters:
      - in: query
        name: domain
        schema:
          type: string
          minLength: 1
        description: '`condition` (diagnosis categories) or `procedure` (procedures).'
        required: true
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (an integer, 1 or more; default 1). Anything else is a 400.
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Rows per page (an integer, 1 or more; default 20, clamped to 100). Anything else
          is a 400.
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
        description: Case-insensitive text the name (or, for a diagnosis, the code) contains.
      tags:
      - Pricing
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceCatalogueResponse'
              examples:
                Diagnoses:
                  value:
                    results:
                    - concept_id: 4213
                      code: K35
                      vocabulary: ICD10CM
                      name: Acute appendicitis
                    - concept_id: 4987
                      code: K80
                      vocabulary: ICD10CM
                      name: Cholelithiasis
                    total: 2
                    page: 1
                    page_size: 20
          description: One page of the catalogue.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                ValidationFailed:
                  value:
                    detail: Validation failed.
                    code: validation_failed
                  summary: Validation failed
                UnknownParameter:
                  value:
                    detail: These query parameters are not accepted.
                    code: field_not_accepted
                  summary: Unknown parameter
                SeveralOrganizations:
                  value:
                    detail: Name exactly one organization in `view_as`.
                    code: single_organization_required
                  summary: Several organizations
          description: Invalid query (`validation_failed`), an unknown query parameter (`field_not_accepted`),
            or several organizations in `view_as`
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
                    code: not_authenticated
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                NotEnabled:
                  value:
                    detail: Price prediction is not enabled for this organization.
                    code: feature_not_enabled
                  summary: Not enabled
                ScopeMissing:
                  value:
                    detail: This API key's scopes do not cover this endpoint.
                    code: permission_denied
                  summary: Scope missing
                NoOrganization:
                  value:
                    detail: This caller has no acting organization.
                    code: organization_required
                  summary: No organization
          description: The key lacks the scope, the feature is not enabled, the caller has no organization,
            or `view_as` names another organization
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 30 seconds.
                    code: throttled
          description: Rate limit or monthly request limit reached
  /api/v1/predict/price/options/:
    get:
      operationId: v1_predict_price_options_retrieve
      description: "\nFor a key bound to one insurer: the providers, surgeons and clients that appear\
        \ in that\ninsurer's own usable claims for one diagnosis or procedure, with the ids\n`POST /api/v1/predict/price/`\
        \ takes as `provider_id`, `surgeon_id` and `client_id`.\n\n**Payor-bound keys only.** Any other\
        \ caller (an unbound key, a user login) is refused with\n403 `payor_bound_key_required`: an unbound\
        \ key prices your organization's claims pooled\nand anonymised, and names no provider, surgeon\
        \ or client.\n\n**Whose claims.** Only claims your organization holds that the key's insurer paid,\
        \ for\nthis concept, in the rolling admission window the price endpoint draws from. An entity\n\
        that appears only in another insurer's claims is never listed, and the price endpoint\nrefuses\
        \ it (403 `entity_not_permitted`).\n\n**The entity floor.** An entity is listed only when your\
        \ organization's usable claims at\nit, over every diagnosis and procedure, come from at least\
        \ 3 insurers and number at least\n15, or are all the key's own insurer's (a claim whose insurer\
        \ is unknown breaks that).\nThe model's figure for an entity is learned from every insurer's claims\
        \ at it; below\nthis floor one or two other insurers' prices could be read back out of it. An\
        \ entity\nthat fails it is not listed, and the price endpoint refuses it with the same 403\n`entity_not_permitted`\
        \ as any other id it does not take.\n\n**What pricing with them means.** The price model is trained\
        \ on ALL of your\norganization's claims, every insurer's. Sending one of these ids conditions\
        \ that model on\nit; it does not restrict the figure to the insurer's own claims. An id the model\
        \ never saw\nin training is not applied (the price endpoint's `inputs_applied` leaves it out).\n\
        \n**Rows.** Ids and names only, no counts, one row per id, ordered by name. A claim with no\n\
        provider, surgeon or client adds nothing to that list. `clients` are client organizations.\n\n\
        **Concept.** As the price endpoint: for `domain=condition` send `code` (an ICD-10 code; its\n\
        3-character category is used) or `concept_id`; for `domain=procedure` send `concept_id`\n(from\
        \ `GET /api/v1/predict/price/concepts/`). Errors: 400 `code_or_concept_id`,\n`invalid_code`, `invalid_concept_id`,\
        \ 404 `concept_not_found`.\n\n**Query parameters.** Any parameter other than `domain`, `code`,\
        \ `concept_id` and\n`view_as` is refused with 400 `field_not_accepted`, naming it in `fields`.\n\
        \n**Access.** The same as the price endpoint: the `predict:price` scope, one organization in\n\
        `view_as`, and the price prediction API enabled. Each call is recorded in your request\nhistory\
        \ as `price_predict_options` with the concept and how many providers, surgeons and\nclients were\
        \ listed (never which), and counts toward a monthly request limit.\n    "
      summary: Providers, surgeons and clients a payor-bound key can price for
      parameters:
      - in: query
        name: code
        schema:
          type: string
          minLength: 1
          maxLength: 16
        description: An ICD-10 code (`K35.80`, `K3580` or `K35`); only its 3-character category is used.
      - in: query
        name: concept_id
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: 'The concept id instead of `code`: the `concept_id` of a catalogue row.'
      - in: query
        name: domain
        schema:
          type: string
          minLength: 1
        description: '`condition` (a diagnosis) or `procedure` (a procedure, by `concept_id` only).'
        required: true
      tags:
      - Pricing
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOptionsResponse'
              examples:
                Options:
                  value:
                    concept:
                      domain: condition
                      concept_id: 4213
                      code: K35
                      vocabulary: ICD10CM
                    providers:
                    - id: 6b0f6a0e-8d2c-4a55-9a3e-0c7d3f1b2a10
                      name: Example Medical Centre
                    surgeons:
                    - id: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
                      name: Example Surgeon
                      title: Dr
                    clients:
                    - id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      name: Example Employer
          description: The bound insurer's own entities for the concept.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                CodeOrConceptId:
                  value:
                    detail: Send exactly one of `code` (domain `condition` only) and `concept_id`.
                    code: code_or_concept_id
                  summary: Code or concept id
                InvalidCode:
                  value:
                    detail: Not a valid ICD-10 code.
                    code: invalid_code
                  summary: Invalid code
                InvalidConceptId:
                  value:
                    detail: Not a valid procedure id.
                    code: invalid_concept_id
                  summary: Invalid concept id
                ValidationFailed:
                  value:
                    detail: Validation failed.
                    code: validation_failed
                  summary: Validation failed
                UnknownParameter:
                  value:
                    detail: These query parameters are not accepted.
                    code: field_not_accepted
                  summary: Unknown parameter
                SeveralOrganizations:
                  value:
                    detail: Name exactly one organization in `view_as`.
                    code: single_organization_required
                  summary: Several organizations
          description: Invalid query, an unknown query parameter, or several organizations in `view_as`
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                Unauthenticated:
                  value:
                    detail: Authentication credentials were not provided.
                    code: not_authenticated
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                NotPayor-bound:
                  value:
                    detail: Only a payor-bound key can list providers, surgeons and clients.
                    code: payor_bound_key_required
                  summary: Not payor-bound
                NotEnabled:
                  value:
                    detail: Price prediction is not enabled for this organization.
                    code: feature_not_enabled
                  summary: Not enabled
                ScopeMissing:
                  value:
                    detail: This API key's scopes do not cover this endpoint.
                    code: permission_denied
                  summary: Scope missing
                NoOrganization:
                  value:
                    detail: This caller has no acting organization.
                    code: organization_required
                  summary: No organization
          description: Not a payor-bound key, the key lacks the scope, the feature is not enabled, the
            caller has no organization, or `view_as` names another organization
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                UnknownProcedure:
                  value:
                    detail: No procedure matches this id.
                    code: concept_not_found
                  summary: Unknown procedure
          description: No diagnosis category or procedure matches
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceError'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 30 seconds.
                    code: throttled
          description: Rate limit or monthly request limit reached
  /api/v1/redact/:
    post:
      operationId: v1_redact_create
      description: "\nReplace PHI in free text with indexed placeholders (`[PERSON_1]`, `[MY_IC_1]`)\n\
        and return the placeholder→original mapping so you can restore values after\nyour own model call.\n\
        \n**The mapping is never stored by us.** It is returned in the response and\ndiscarded; you own\
        \ re-identification. Every response carries a redaction\nreceipt (engine, version, entity counts)\
        \ as the auditable proof that redaction\nran — the receipt records what was caught, and is not\
        \ a claim of perfect\nrecall.\n\nDetection covers Malaysian identifiers (MyKad/IC, MRN, passport,\
        \ local phone\nformats) alongside names, emails, and card/account numbers. Clinical content is\n\
        deliberately preserved: ages, dates like \"day 3 post-op\", vitals, and dosage\nabbreviations\
        \ are NOT redacted, because stripping them destroys the meaning a\ndownstream model needs.\n\n\
        **Fail-closed:** if redaction cannot complete, this endpoint returns 503 with\n`code` `redaction_failed_closed`,\
        \ a `failed_closed` receipt and no text — it never\nreturns your input unredacted.\n    "
      summary: Redact PHI/PII from free text
      tags:
      - Gateway
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedactRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedactRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedactRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactResponse'
              examples:
                DischargeSummaryLine:
                  value:
                    redacted_text: '[PERSON_1], IC [MY_IC_1], 72yo day 3 post-op, 500 mg PO amoxicillin'
                    mapping:
                      '[PERSON_1]': Ali bin Ahmad
                      '[MY_IC_1]': 880101-14-5501
                    entities_redacted:
                      PERSON: 1
                      MY_IC: 1
                    redaction_receipt:
                      receipt_version: 1
                      engine: presidio-composed
                      engine_version: '1'
                      rehydration_complete: null
                      unresolved_placeholder_count: 0
                      client_preredacted: false
                      entities_redacted:
                        PERSON: 1
                        MY_IC: 1
                      free_text_fields: 1
                      client_asserted_deidentified: false
                      redacted_anyway: false
                      status: ok
                      retention: metadata_only
                  summary: Discharge summary line
          description: Redacted text plus the mapping and receipt
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: '`view_as` names an organization the caller may not act as'
        '429':
          description: Rate limit exceeded
        '503':
          description: 'Redaction failed — request refused (`code`: `redaction_failed_closed`)'
  /api/v1/search/:
    post:
      operationId: v1_search_create
      description: 'Searches OMOP concepts across multiple medical vocabularies (ICD10, SNOMED, CPT4,
        etc.) with optional domain filtering. Returns matching concepts with metadata about the search.


        **Supports both JWT (Authorization: Bearer) and API key (X-API-Key) authentication.**


        Supported vocabularies: ICD10, ICD10CM, ICD10PCS, ICD9CM, ICD9Proc, SNOMED, CPT4, HCPCS, RxNorm,
        RxNorm Extension, OPCS4, DRG, LOINC, ICDO3, ATC, MediAsas DRG.


        A search with no `vocabularies` filter scans ICD10, ICD10CM, ICD10PCS, ICD9CM, ICD9Proc, SNOMED,
        CPT4, HCPCS, RxNorm, RxNorm Extension. ATC, DRG, ICDO3, LOINC, MediAsas DRG, OPCS4 are supported
        but must be requested by name.


        Supported domains: Condition, Procedure, Drug, Measurement, Observation, Device, Specimen.'
      summary: Search OMOP concepts (API)
      parameters:
      - in: query
        name: profile
        schema:
          type: string
          enum:
          - explore
          - hybrid
          - mapping
        description: Profile preset that bundles sensible defaults for a use case. `mapping` — find equivalent
          codes in the requested vocabularies (2-hop graph traversal, vocab-filtered, no bridges). `explore`
          — show the full graph neighborhood (3-hop, includes SNOMED bridge concepts, no vocab filter,
          no quality gate). `hybrid` — plain text search, no graph. Individual params in the request body
          override profile defaults.
      - in: query
        name: q
        schema:
          type: string
        description: Search query string (e.g. 'diabetes', 'appendectomy'). Can also be supplied in the
          request body as `query` (one of `q` or `query` is required).
      - in: query
        name: response_format
        schema:
          type: string
          enum:
          - json
          - llm
          default: json
        description: Response format. 'json' (default) returns structured JSON. 'llm' returns compact
          markdown tables (text/markdown) optimized for LLM consumption. When 'llm', the response body
          is markdown text rather than the JSON schema shown below.
      - in: query
        name: search_mode
        schema:
          type: string
          enum:
          - graph
          - hybrid
        description: Search strategy. `hybrid` uses RRF+reranking (dense + sparse fusion); `graph` uses
          OMOP graph traversal for cross-vocabulary and hierarchical expansion. Overrides the `profile`
          preset; the body's `search_mode` overrides this.
      tags:
      - Vocabulary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchOMOPConceptRequestRequest'
            examples:
              HybridSearch(default):
                value:
                  query: diabetes
                  top_k: 5
                summary: Hybrid search (default)
                description: Plain hybrid search across all supported vocabularies.
              GraphSearchWithVocabularyFilter:
                value:
                  query: appendectomy
                  vocabularies:
                  - ICD10CM
                  - ICD10PCS
                  top_k: 10
                  include_bridges: false
                  filter_to_input_vocab: true
                summary: Graph search with vocabulary filter
                description: Graph-native search restricted to ICD10CM/ICD10PCS. Cross-vocab anchor fallback
                  (via SNOMED) and 2-hop Maps-to translation let queries like 'appendectomy' find ICD10PCS/CM
                  equivalents even when the literal term isn't in the target vocabulary.
              MappingProfile(cross-vocabEquivalents):
                value:
                  query: type 2 diabetes mellitus
                  vocabularies:
                  - SNOMED
                  - ICD10CM
                  top_k: 5
                summary: Mapping profile (cross-vocab equivalents)
                description: Use the `mapping` profile to find equivalent codes across vocabularies. Pass
                  `?profile=mapping` as a query-string param alongside this body.
              Query-string-only(q+Profile):
                value: {}
                summary: Query-string-only (q + profile)
                description: Minimal request using only query-string params. The body can be empty when
                  `q` is supplied. Equivalent to the `mapping` example above but without a body.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SearchOMOPConceptRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SearchOMOPConceptRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOMOPVocabularyResponse'
          description: Search results with metadata
        '400':
          description: 'Invalid request parameters (missing query, invalid search_mode, invalid vocabularies,
            invalid domain, top_k out of range, an unknown search_type, a language that is not a text
            search configuration on this database, rank_normalization outside 0-31, or a relationship_filters
            key outside the allowed list). The body names the field: {<field>: [message]}'
        '401':
          description: Invalid or missing authentication. Provide either Authorization header (Bearer
            token) or X-API-Key header.
        '500':
          description: Internal server error during search
        '503':
          description: 'The search model could not be loaded. Retry after the `Retry-After` seconds; the
            body is `{"detail": ...}` with fixed text.'
  /api/v1/search/batch/:
    post:
      operationId: v1_search_batch_create
      description: 'Search many raw terms in a single request. Every term''s query is embedded in ONE
        batched pass, then each term runs the same hybrid pipeline as `POST /api/v1/search/` (dense +
        FTS + RRF + cross-encoder rerank). Results are returned in the same order as the input `terms`
        array, and each term carries a `confidence` signal (top score + margin over the runner-up) so
        callers can gate on match quality.


        Per-term `domain_id`, `vocabularies` and `top_k` override the request-level shared defaults. FTS
        options are shared across the batch. At most 100 terms per request.


        This endpoint always uses hybrid search mode; for graph-mode or relationship expansion use the
        single-query `POST /api/v1/search/`.


        **Supports both JWT (Authorization: Bearer) and API key (X-API-Key) authentication.**'
      summary: Batch search OMOP concepts (API)
      parameters:
      - in: query
        name: response_format
        schema:
          type: string
          enum:
          - json
          - llm
          default: json
        description: Response format. 'json' (default) returns structured JSON. 'llm' returns compact
          markdown tables (text/markdown) optimized for LLM consumption. When 'llm', the response body
          is markdown text rather than the JSON schema shown below.
      tags:
      - Vocabulary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSearchRequestRequest'
            examples:
              BatchOfRawTerms:
                value:
                  terms:
                  - query: type 2 diabetes
                    domain_id: Condition
                  - query: appendectomy
                    vocabularies:
                    - ICD10PCS
                    top_k: 5
                  - query: metformin
                  vocabularies:
                  - SNOMED
                  - ICD10CM
                  top_k: 10
                summary: Batch of raw terms
                description: Three terms with shared and per-term filters.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchSearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchSearchRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSearchResponse'
          description: Per-term search results (input order) with confidence signals
        '400':
          description: Invalid request (missing/empty terms, too many terms, a missing or non-text per-term
            query, invalid vocabularies/domain, top_k out of range or not an integer, an unknown search_type,
            a language that is not a text search configuration on this database, or rank_normalization
            outside 0-31)
        '401':
          description: Invalid or missing authentication (Bearer token or X-API-Key).
        '500':
          description: Internal server error during search
        '503':
          description: 'The search model could not be loaded. Retry after the `Retry-After` seconds; the
            body is `{"detail": ...}` with fixed text.'
  /api/v1/search/domains/:
    get:
      operationId: v1_search_domains_retrieve
      description: 'Returns list of all supported OMOP domains available for concept search.


        **Supports both JWT (Authorization: Bearer) and API key (X-API-Key) authentication.**'
      summary: Get supported domains (API)
      parameters:
      - in: query
        name: response_format
        schema:
          type: string
          enum:
          - json
          - llm
          default: json
        description: Response format. 'json' (default) returns structured JSON. 'llm' returns compact
          markdown tables (text/markdown) optimized for LLM consumption. When 'llm', the response body
          is markdown text rather than the JSON schema shown below.
      tags:
      - Vocabulary
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedDomainsResponse'
          description: Supported domains
        '401':
          description: Invalid or missing authentication. Provide either Authorization header (Bearer
            token) or X-API-Key header.
  /api/v1/search/vocabularies/:
    get:
      operationId: v1_search_vocabularies_retrieve
      description: 'Returns lists of all supported medical vocabularies (ICD10, SNOMED, CPT4, etc.) and
        domains (Condition, Procedure, Drug, etc.) available for OMOP concept search.


        **Supports both JWT (Authorization: Bearer) and API key (X-API-Key) authentication.**'
      summary: Get supported vocabularies (API)
      parameters:
      - in: query
        name: response_format
        schema:
          type: string
          enum:
          - json
          - llm
          default: json
        description: Response format. 'json' (default) returns structured JSON. 'llm' returns compact
          markdown tables (text/markdown) optimized for LLM consumption. When 'llm', the response body
          is markdown text rather than the JSON schema shown below.
      tags:
      - Vocabulary
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedVocabulariesResponse'
          description: Supported vocabularies and domains
        '401':
          description: Invalid or missing authentication. Provide either Authorization header (Bearer
            token) or X-API-Key header.
  /api/v1/usage/history/:
    get:
      operationId: user_api_usage_history
      description: 'Returns the authenticated user''s individual API request log as a paginated list over
        the selected date range, optionally filtered by service type. Scoped to the caller''s own activity:
        a JWT sees the user''s interactive requests, an API key sees that key''s own requests.'
      summary: Personal API usage history
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: 'End date (ISO 8601 date or datetime; default: now). A value that is not a date is
          a 400, not ignored.'
      - in: query
        name: page
        schema:
          type: integer
        description: 'Page number (integer, 1 or more; default: 1). Anything else is a 400.'
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Items per page (integer, 1 or more; default: 20, clamped to 100). Anything else
          is a 400.'
      - in: query
        name: service_type
        schema:
          type: string
        description: Filter by service type (e.g. "drg_classify", "drg_agent")
      - in: query
        name: start_date
        schema:
          type: string
        description: 'Start date (ISO 8601 date or datetime; default: 30 days ago). A value that is not
          a date is a 400, not ignored.'
      tags:
      - Account
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserApiUsageHistory'
          description: ''
        '400':
          description: '`start_date` or `end_date` is present but is not an ISO 8601 date or datetime,
            or `page` or `page_size` is present but is not an integer of 1 or more, as `{field: [message]}`
            naming the field. A malformed date used to be ignored; a malformed or zero page or page size
            used to be silently replaced by the default. An absent or empty value is the default.'
  /api/v1/usage/history/{log_id}/:
    get:
      operationId: user_api_usage_detail
      description: Returns the full detail of a single API request log entry made by the authenticated
        user, identified by log ID. Returns 404 if the log does not exist or does not belong to the caller.
      summary: Personal API usage detail
      parameters:
      - in: path
        name: log_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Account
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiUsageHistory'
          description: ''
        '404':
          description: Not found
  /api/v1/usage/summary/:
    get:
      operationId: user_api_usage_summary
      description: 'Returns the authenticated user''s aggregated API usage (request counts and token totals)
        over the selected date range, optionally filtered by service type. Scoped to the caller''s own
        activity: a JWT sees the user''s interactive requests, an API key sees that key''s own requests.'
      summary: Personal API usage summary
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: 'End date (ISO 8601 date or datetime; default: now). A value that is not a date is
          a 400, not ignored.'
      - in: query
        name: service_type
        schema:
          type: string
        description: Filter by service type (e.g. "drg_classify", "drg_agent")
      - in: query
        name: start_date
        schema:
          type: string
        description: 'Start date (ISO 8601 date or datetime; default: 30 days ago). A value that is not
          a date is a 400, not ignored.'
      tags:
      - Account
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiUsageSummary'
          description: ''
        '400':
          description: 'A filter the route takes is present but malformed: `start_date` or `end_date`
            is not an ISO 8601 date or datetime, `organization_id` or `api_key_id` is not a UUID, or `limit`
            is not an integer (0 or more). Answered as `{field: [message]}` naming the field, for example
            `{"start_date": ["Enter a valid ISO 8601 date or datetime, ..."]}`. A malformed date used
            to be ignored and the answer covered every date; a malformed id or limit used to be a 500.
            An absent or empty filter is the default, not an error.'
components:
  schemas:
    AncestorConcept:
      type: object
      properties:
        concept_id:
          type: integer
        concept_name:
          type: string
        concept_code:
          type: string
        vocabulary_id:
          type: string
        concept_class_id:
          type: string
        min_levels_of_separation:
          type: integer
        max_levels_of_separation:
          type: integer
      required:
      - concept_class_id
      - concept_code
      - concept_id
      - concept_name
      - max_levels_of_separation
      - min_levels_of_separation
      - vocabulary_id
    AncestorsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AncestorConcept'
        metadata:
          type: object
          additionalProperties: {}
        paths:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/PathConcept'
          description: Ordered chains, direct parent to root, one per branch. Absent when include_paths=false.
      required:
      - metadata
      - results
    BatchSearchConfidence:
      type: object
      properties:
        score_source:
          nullable: true
          description: 'Where this term''s similarity scores came from. Only ''cross_encoder'' scores
            are calibrated cross-encoder logits on a consistent scale; ''rrf''/''rank'' are uncalibrated
            fallback scores (used for small candidate sets) whose magnitudes are NOT comparable across
            terms. ''none'' means the term had no results.


            * `cross_encoder` - cross_encoder

            * `rrf` - rrf

            * `rank` - rank

            * `none` - none'
          oneOf:
          - $ref: '#/components/schemas/ScoreSourceEnum'
          - $ref: '#/components/schemas/NullEnum'
        reranked:
          type: boolean
          description: True iff score_source == 'cross_encoder'. When False, the numeric confidence fields
            below are null because fallback scores cannot be safely thresholded.
        top_score:
          type: number
          format: double
          nullable: true
          description: Calibrated cross-encoder similarity of the top concept. Null when the term has
            no results OR was not reranked (see score_source).
        runner_up_score:
          type: number
          format: double
          nullable: true
          description: Calibrated cross-encoder similarity of the second concept. Null when fewer than
            2 results OR the term was not reranked.
        margin:
          type: number
          format: double
          nullable: true
          description: top_score - runner_up_score. A large positive margin means a confident, unambiguous
            top match. Only meaningful when reranked=True; null otherwise (fewer than 2 results or not
            reranked). Gate acceptance on this ONLY when reranked is True.
      required:
      - margin
      - reranked
      - runner_up_score
      - score_source
      - top_score
    BatchSearchRequestRequest:
      type: object
      description: 'Request body for POST /api/v1/search/batch/.


        Embeds every term''s query in a single batched pass, then runs the standard

        per-term hybrid search (dense + FTS + RRF + rerank). Per-term `domain_id`,

        `vocabularies` and `top_k` override the request-level shared defaults.'
      properties:
        terms:
          type: array
          items:
            $ref: '#/components/schemas/BatchSearchTermRequest'
          description: 1-100 terms to search. Order is preserved in the response.
          maxItems: 100
          minItems: 1
        vocabularies:
          type: array
          items:
            type: string
            minLength: 1
          description: Default vocabulary filter for terms that don't specify their own.
        domain_id:
          type: string
          minLength: 1
          description: Default domain filter for terms that don't specify their own.
        top_k:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          description: Default result cap for terms that don't specify their own (1-100).
        search_type:
          allOf:
          - $ref: '#/components/schemas/SearchTypeEnum'
          default: websearch
          description: 'FTS search type applied to every term.


            * `plain` - plain

            * `phrase` - phrase

            * `raw` - raw

            * `websearch` - websearch'
        language:
          type: string
          minLength: 1
          default: english
          description: PostgreSQL text search configuration applied to every term; a name the database
            does not have is a 400.
        use_search_rank:
          type: boolean
          default: true
          description: Use SearchRank ordering for FTS results.
        rank_normalization:
          type: integer
          maximum: 31
          minimum: 0
          default: 0
          description: SearchRank normalization flags (0-31).
        min_relevance:
          type: number
          format: double
          nullable: true
          default: -2.0
          description: Cross-encoder logit threshold applied to every term. Results below this are dropped.
            Pass null to disable filtering.
      required:
      - terms
    BatchSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchSearchTermResult'
          description: Per-term results, in the same order as the input `terms` array.
        metadata:
          type: object
          additionalProperties: {}
          description: Batch-level metadata (term count, search mode, shared FTS options).
      required:
      - metadata
      - results
    BatchSearchTermRequest:
      type: object
      description: A single term in a batch concept-search request.
      properties:
        query:
          type: string
          minLength: 1
          description: Raw term to search (e.g., 'type 2 diabetes').
        domain_id:
          type: string
          minLength: 1
          description: Per-term domain filter (e.g., 'Condition'). Overrides no shared default.
        vocabularies:
          type: array
          items:
            type: string
            minLength: 1
          description: Per-term vocabulary filter (case-insensitive). Falls back to the request-level
            `vocabularies`, then to all supported vocabularies.
        top_k:
          type: integer
          maximum: 100
          minimum: 1
          description: Per-term result cap (1-100). Falls back to request-level `top_k`.
      required:
      - query
    BatchSearchTermResult:
      type: object
      properties:
        query:
          type: string
          description: Echo of the input term query.
        domain_id:
          type: string
          nullable: true
          description: Domain filter actually applied for this term.
        vocabularies:
          type: array
          items:
            type: string
          description: Vocabularies actually searched for this term (DB casing).
        top_k:
          type: integer
          description: Result cap actually applied for this term.
        concepts:
          type: array
          items:
            $ref: '#/components/schemas/OMOPConcept'
          description: Ranked matches, same shape as the single-query endpoint.
        confidence:
          allOf:
          - $ref: '#/components/schemas/BatchSearchConfidence'
          description: Per-term confidence signal derived from the top two similarities.
      required:
      - concepts
      - confidence
      - domain_id
      - query
      - top_k
      - vocabularies
    ChatCompletionRequestRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 1
          description: A model id from the registry. External keys may only use models approved for PHI
            traffic.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageRequest'
        max_tokens:
          type: integer
          maximum: 32000
          minimum: 1
          default: 1024
        temperature:
          type: number
          format: double
          nullable: true
        top_p:
          type: number
          format: double
          nullable: true
        stop:
          type: string
          nullable: true
          minLength: 1
        stream:
          type: boolean
          default: false
        reasoning:
          type: object
          additionalProperties: {}
          nullable: true
          description: 'Reasoning-model controls, e.g. {"effort": "high", "summary": "detailed"}. Only
            `effort` and `summary` are forwarded; other keys are ignored. Applies to the GPT-5.x family;
            ignored by other models.'
        redact_only:
          type: boolean
          default: false
          description: Return the model's answer WITHOUT substituting your values back (placeholders remain).
            Required if you want streaming, and useful when the answer is going somewhere that should
            not hold PHI.
        tools:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: OpenAI-style function tools. Forwarded to the model; returned tool_calls come back
            with your values re-hydrated.
        tool_choice:
          description: '"auto" (default) or "none". Forcing a specific call ("required", or a named function)
            is refused rather than downgraded to "auto", so a forced call never appears to have been honoured
            when it was not.'
        conversation_key:
          type: string
          description: Supply the same value across turns so a given person keeps the same placeholder;
            multi-turn clients resend history and renaming mid-conversation confuses the model.
          maxLength: 200
      required:
      - messages
      - model
    ChatMessageRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/ChatMessageRoleEnum'
        content:
          type: string
          nullable: true
          maxLength: 100000
        tool_calls:
          type: array
          items:
            type: object
            additionalProperties: {}
        tool_call_id:
          type: string
          minLength: 1
          description: 'Required on a `tool` message: it matches the result to the call that asked for
            it.'
          maxLength: 200
      required:
      - role
    ChatMessageRoleEnum:
      enum:
      - system
      - developer
      - user
      - assistant
      - tool
      type: string
      description: '* `system` - system

        * `developer` - developer

        * `user` - user

        * `assistant` - assistant

        * `tool` - tool'
    CodeRequestDomainEnum:
      enum:
      - Condition
      - Procedure
      - Drug
      - Measurement
      - Observation
      - Device
      - Specimen
      type: string
      description: '* `Condition` - Condition

        * `Procedure` - Procedure

        * `Drug` - Drug

        * `Measurement` - Measurement

        * `Observation` - Observation

        * `Device` - Device

        * `Specimen` - Specimen'
    CodeRequestRequest:
      type: object
      description: 'Input to `/code`.


        Deliberately small. Routing (graph vs hybrid, and whether to narrow by

        domain) is NOT a request parameter — it comes from the vocabulary

        capability registry, which is the point of the endpoint. `domain` is the

        one override, for a caller who genuinely knows better than the registry.'
      properties:
        text:
          type: string
          minLength: 1
          description: Clinical text to resolve, e.g. 'lap appendicectomy'.
        vocabulary:
          allOf:
          - $ref: '#/components/schemas/VocabularyEnum'
          description: 'Target vocabulary. Every choice here is served; see the `routing.evidence` field
            in the response for how well each one''s retrieval has been validated.


            * `ICD10CM` - ICD10CM

            * `ICD10PCS` - ICD10PCS

            * `CPT4` - CPT4

            * `RxNorm` - RxNorm

            * `SNOMED` - SNOMED'
        domain:
          nullable: true
          description: 'Override the OMOP domain filter. Three distinct inputs:


            - **omit** — the vocabulary decides. ICD10PCS narrows to Procedure and RxNorm to Drug, because
            a filter excludes ~0% of each. ICD10CM, CPT4 and SNOMED stay unfiltered, because narrowing
            them hides billable concepts behind plausible wrong answers.

            - **a domain** — filter by it, whatever the vocabulary implies.

            - **null** — do NOT filter, even where the vocabulary implies a domain. This is the only way
            to opt out of an implied filter.


            * `Condition` - Condition

            * `Procedure` - Procedure

            * `Drug` - Drug

            * `Measurement` - Measurement

            * `Observation` - Observation

            * `Device` - Device

            * `Specimen` - Specimen'
          oneOf:
          - $ref: '#/components/schemas/CodeRequestDomainEnum'
          - $ref: '#/components/schemas/NullEnum'
        top_k:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          description: Number of concepts to return (1-100).
      required:
      - text
      - vocabulary
    CodeResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            additionalProperties: {}
        routing:
          $ref: '#/components/schemas/CodeRouting'
        metadata:
          type: object
          additionalProperties: {}
      required:
      - metadata
      - results
      - routing
    CodeRouting:
      type: object
      description: What the API decided, and how much it knows about that decision.
      properties:
        vocabulary:
          type: string
        search_mode:
          type: string
          description: 'Retrieval route chosen from the registry: ''graph'' or ''hybrid''.'
        effective_search_mode:
          type: string
          description: Present only when the engine degraded the chosen mode. Reports what actually ran,
            so `search_mode` is never a statement about intent alone.
        fallback_reason:
          type: string
        domain_filter:
          type: string
          nullable: true
          description: Domain applied, or null if unfiltered.
        domain_source:
          type: string
          nullable: true
          description: '''caller'' if overridden, ''vocabulary'' if implied, null if none.'
        evidence:
          type: string
          description: 'How well this routing is validated: ''strong'' (a leak-free gold set), ''structural''
            (forced by a property of the data), ''weak'' (small-n or retracted), ''none'' (never measured).'
        measured:
          type: boolean
          description: False when evidence is 'none'. The answer is served, not validated.
        caveat:
          type: string
          description: Present only when `measured` is false.
      required:
      - domain_filter
      - domain_source
      - evidence
      - measured
      - search_mode
      - vocabulary
    DRGAgentRequestRequest:
      type: object
      description: Request serializer for the DRG AI agent endpoint.
      properties:
        message:
          type: string
