openapi: 3.0.3
info:
  title: Healthproximate API
  version: 1.0.0
  description: 'DRG classification, OMOP vocabulary services and a PHI-safe LLM gateway.


    Generated by `manage.py export_commercial_openapi` from an explicit operation allowlist (`app/openapi_commercial.py`).
    An endpoint appears here because someone published it, never because it exists.'
  contact:
    email: admin@valiancehealth.ai
paths:
  /api/v1/drg/agent/:
    post:
      operationId: v1_drg_agent_create
      description: "\nUse an AI agent to classify hospital encounters into MS-DRG codes from\nnatural\
        \ language clinical text. The agent can extract ICD-10 codes from\nclinical descriptions and explain\
        \ DRG assignments.\n\n**LLM cost:** ~$0.01-0.05 per request (uses Claude Sonnet via AWS Bedrock).\n\
        \nFor structured ICD-10 code input, use the `/api/v1/drg/classify/` endpoint instead ($0 cost).\n\
        \    "
      summary: Classify clinical text with the DRG agent
      tags:
      - DRG
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DRGAgentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DRGAgentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DRGAgentRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DRGAgentResponse'
              examples:
                HIVDiagnosis:
                  value:
                    response: Based on the diagnosis code B20 (HIV disease), this classifies to **DRG
                      977** - HIV WITH RELATED CONDITION...
                    token_usage:
                      input_tokens: 1520
                      output_tokens: 340
                    response_time_ms: 3200
                  summary: HIV Diagnosis
          description: Agent response with DRG classification
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '500':
          description: Internal server error
  /api/v1/drg/batch/:
    post:
      operationId: v1_drg_batch_create
      description: "\nSubmit up to 1000 cases in one call; classification runs asynchronously.\nReturns\
        \ a job id immediately — poll `GET /api/v1/drg/batch/{job_id}/` for\nstatus and progressive per-case\
        \ results.\n\n**Idempotency-Key header is required.** Retrying a submission with the same\nkey\
        \ returns the same job (HTTP 200 instead of 201) and never re-processes or\nre-bills — safe to\
        \ retry on any network failure.\n\nEach case: `case_ref` (your identifier, unique within the batch),\
        \ `dx_codes`\n(ICD-10-CM, primary first), optional `pr_codes` (ICD-10-PCS), `gender`,\n`is_alive`.\
        \ `source_dialect` currently accepts `icd10cm` only — WHO ICD-10 /\nICD-11 batches are refused\
        \ up front rather than mis-grouped.\n\nBilling: one ledger row per case (`service_type=\"drg_batch\"\
        `), written exactly\nonce even across worker retries. A spend-capped organization's submission\
        \ is\nrefused at enqueue with a 429 and costs nothing.\n    "
      summary: Submit a DRG batch job
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Caller-chosen key (8-128 chars) making the submission retry-safe.
        required: true
      tags:
      - DRG
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DRGBatchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DRGBatchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DRGBatchRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '201':
          description: Job created
        '200':
          description: Idempotent replay — existing job returned
        '400':
          description: Invalid request, unsupported dialect, or missing Idempotency-Key
        '401':
          description: Authentication required
        '429':
          description: Batch rate limit, monthly limit, or spend cap reached
  /api/v1/drg/batch/{job_id}/:
    get:
      operationId: v1_drg_batch_retrieve
      description: "\nStatus of a batch job with per-case results as they complete. Poll this —\na job\
        \ in `queued`/`running` will keep gaining `done`/`failed` cases; terminal\njob states are `done`\
        \ (at least one case succeeded), `failed` (every case\nfailed), and `parked` (the organization\
        \ hit its spend limit; the job resumes\nautomatically when the limit clears).\n\nCase results\
        \ carry your `case_ref`, so you can join them back to your\nrecords. Failed cases carry an `error`\
        \ string; they were not billed as\nsuccessful classifications.\n    "
      summary: Get DRG batch job status
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - DRG
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          description: Job status
        '401':
          description: Authentication required
        '404':
          description: No such job in your organization
  /api/v1/drg/classify/:
    post:
      operationId: v1_drg_classify_create
      description: "\nClassify ICD-10-CM diagnosis codes and ICD-10-PCS procedure codes into an MS-DRG\
        \ code\nusing the vhdrg classification engine.\n\n**No LLM cost** — this endpoint uses deterministic\
        \ rule-based classification.\n\nSupported MS-DRG versions: v36 (FY2019) through v40 (FY2023),\
        \ and v43 (FY2026).\nCMS grouper data for v41/v42 is not shipped by the vhdrg engine.\n    "
      summary: Classify ICD-10 codes to a DRG
      tags:
      - DRG
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DRGClassifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DRGClassifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DRGClassifyRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DRGClassifyResponse'
              examples:
                SimplePneumonia:
                  value:
                    primary_drg: '195'
                    description: SIMPLE PNEUMONIA AND PLEURISY WITHOUT CC/MCC
                    mdc: '04'
                    type: M
                    all_candidates:
                    - '195'
                    - '000'
                    version: v40
                    fiscal_year: FY 2023
                    input:
                      dx_codes:
                      - J189
                      - J310
                      gender: F
                      is_alive: true
                      pr_codes: []
                    response_time_ms: 12
                  summary: Simple Pneumonia
          description: DRG classification result
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '500':
          description: Internal server error
  /api/v1/fhir/drg/$classify:
    post:
      operationId: v1_fhir_drg_classify_create
      description: "\nFHIR front door for the deterministic DRG classifier. Send a Bundle containing\n\
        the encounter's `Condition` resources (ICD-10-CM codings; principal marked via\n`Encounter.diagnosis`\
        \ rank 1, else first-listed), optional `Procedure`\nresources (ICD-10-PCS codings), a minimal\
        \ `Patient` (only `gender` is read),\nand optionally an `Encounter` (`hospitalization.dischargeDisposition`\
        \ maps to\ndischarge status).\n\n**Patient identifiers are dropped at the boundary** — names,\
        \ identifiers,\naddresses and telecom are never read and never stored; the response attests\n\
        this with `fhir_identifiers_dropped`. The submitted Bundle is not persisted.\n\nReturns a FHIR\
        \ `Parameters` resource carrying the DRG code, description and\ngrouper version. Malformed or\
        \ unclassifiable input returns an\n`OperationOutcome` — never a partial result.\n    "
      summary: Classify a FHIR R4 Bundle
      tags:
      - DRG
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          description: FHIR Parameters with the DRG result
        '400':
          description: OperationOutcome — invalid or unclassifiable Bundle
        '401':
          description: Authentication required
        '429':
          description: Rate or monthly limit reached
  /api/v1/llm/chat/completions:
    post:
      operationId: v1_llm_chat_completions_create
      description: "\nAn OpenAI-compatible chat completion endpoint that redacts PHI before the\nmodel\
        \ sees it and restores the real values in the answer.\n\n```python\nclient = OpenAI(base_url=\"\
        https://<host>/api/v1/llm\", api_key=\"hpx_...\")\nclient.chat.completions.create(model=\"<model>\"\
        , messages=[...])\n```\n\nPer request: your message content is redacted (Malaysian IC/MRN/passport/phone,\n\
        names, emails, account numbers — clinical content such as ages, dates like\n\"day 3 post-op\"\
        , vitals and dosages is preserved), the placeholders go to the\nmodel, and the model's answer\
        \ has your values substituted back. The mapping\nlives only in the request's memory and is never\
        \ stored.\n\nEvery response carries `redaction_receipt`, including `rehydration_complete`\nand\
        \ `unresolved_placeholder_count` — if the model altered our placeholders, the\nreceipt says so\
        \ rather than returning residue silently.\n\n**Not supported in v1** (refused, not silently dropped):\
        \ streaming while\nre-hydrating (`stream` with `redact_only=false`), non-text content parts,\n\
        and tool/function calling.\n    "
      summary: Create a chat completion
      tags:
      - Gateway
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequestRequest'
        required: true
      security:
      - gateway_bearer_auth: []
      responses:
        '200':
          description: chat.completion with a redaction receipt attached
        '400':
          description: Invalid request, or model not approved
        '401':
          description: Authentication required
        '429':
          description: Rate limit or spend limit reached
        '503':
          description: Redaction failed — request refused
  /api/v1/redact/:
    post:
      operationId: v1_redact_create
      description: "\nReplace PHI in free text with indexed placeholders (`[PERSON_1]`, `[MY_IC_1]`)\n\
        and return the placeholder→original mapping so you can restore values after\nyour own model call.\n\
        \n**The mapping is never stored by us.** It is returned in the response and\ndiscarded; you own\
        \ re-identification. Every response carries a redaction\nreceipt (engine, version, entity counts)\
        \ as the auditable proof that redaction\nran — the receipt records what was caught, and is not\
        \ a claim of perfect\nrecall.\n\nDetection covers Malaysian identifiers (MyKad/IC, MRN, passport,\
        \ local phone\nformats) alongside names, emails, and card/account numbers. Clinical content is\n\
        deliberately preserved: ages, dates like \"day 3 post-op\", vitals, and dosage\nabbreviations\
        \ are NOT redacted, because stripping them destroys the meaning a\ndownstream model needs.\n\n\
        **Fail-closed:** if redaction cannot complete, this endpoint returns 503 with a\n`failed_closed`\
        \ receipt and no text — it never returns your input unredacted.\n    "
      summary: Redact PHI from text
      tags:
      - Gateway
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedactRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedactRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedactRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactResponse'
              examples:
                DischargeSummaryLine:
                  value:
                    redacted_text: '[PERSON_1], IC [MY_IC_1], 72yo day 3 post-op, 500 mg PO amoxicillin'
                    mapping:
                      '[PERSON_1]': Ali bin Ahmad
                      '[MY_IC_1]': 880101-14-5501
                    entities_redacted:
                      PERSON: 1
                      MY_IC: 1
                    redaction_receipt:
                      receipt_version: 1
                      engine: presidio-composed
                      engine_version: '1'
                      rehydration_complete: null
                      unresolved_placeholder_count: 0
                      client_preredacted: false
                      entities_redacted:
                        PERSON: 1
                        MY_IC: 1
                      free_text_fields: 1
                      client_asserted_deidentified: false
                      redacted_anyway: false
                      status: ok
                      retention: metadata_only
                  summary: Discharge summary line
          description: Redacted text plus the mapping and receipt
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '429':
          description: Rate limit exceeded
        '503':
          description: Redaction failed — request refused
  /api/v1/search/:
    post:
      operationId: v1_search_create
      description: 'Searches OMOP concepts across multiple medical vocabularies (ICD10, SNOMED, CPT4,
        etc.) with optional domain filtering. Returns matching concepts with metadata about the search.


        **Supports both JWT (Authorization: Bearer) and API key (X-API-Key) authentication.**


        Supported vocabularies: ICD10, ICD10CM, ICD10PCS, ICD9CM, ICD9Proc, SNOMED, CPT4, HCPCS, RxNorm,
        RxNorm Extension, OPCS4, DRG.


        A search with no `vocabularies` filter scans ICD10, ICD10CM, ICD10PCS, ICD9CM, ICD9Proc, SNOMED,
        CPT4, HCPCS, RxNorm, RxNorm Extension. DRG, OPCS4 are supported but must be requested by name.


        Supported domains: Condition, Procedure, Drug, Measurement, Observation, Device, Specimen.'
      summary: Search OMOP concepts
      parameters:
      - in: query
        name: profile
        schema:
          type: string
          enum:
          - explore
          - hybrid
          - mapping
        description: Profile preset that bundles sensible defaults for a use case. `mapping` — find equivalent
          codes in the requested vocabularies (2-hop graph traversal, vocab-filtered, no bridges). `explore`
          — show the full graph neighborhood (3-hop, includes SNOMED bridge concepts, no vocab filter,
          no quality gate). `hybrid` — plain text search, no graph. Individual params in the request body
          override profile defaults.
      - in: query
        name: q
        schema:
          type: string
        description: Search query string (e.g. 'diabetes', 'appendectomy'). Can also be supplied in the
          request body as `query` (one of `q` or `query` is required).
      - in: query
        name: response_format
        schema:
          type: string
          enum:
          - json
          - llm
          default: json
        description: Response format. 'json' (default) returns structured JSON. 'llm' returns compact
          markdown tables (text/markdown) optimized for LLM consumption. When 'llm', the response body
          is markdown text rather than the JSON schema shown below.
      - in: query
        name: search_mode
        schema:
          type: string
          enum:
          - graph
          - hybrid
          default: hybrid
        description: Search strategy. `hybrid` uses RRF+reranking (dense + sparse fusion); `graph` uses
          OMOP graph traversal for cross-vocabulary and hierarchical expansion. Overridden by the `profile`
          preset when both are set.
      tags:
      - Vocabulary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchOMOPConceptRequestRequest'
            examples:
              HybridSearch(default):
                value:
                  query: diabetes
                  top_k: 5
                summary: Hybrid search (default)
                description: Plain hybrid search across all supported vocabularies.
              GraphSearchWithVocabularyFilter:
                value:
                  query: appendectomy
                  vocabularies:
                  - ICD10CM
                  - ICD10PCS
                  top_k: 10
                  include_bridges: false
                  filter_to_input_vocab: true
                summary: Graph search with vocabulary filter
                description: Graph-native search restricted to ICD10CM/ICD10PCS. Cross-vocab anchor fallback
                  (via SNOMED) and 2-hop Maps-to translation let queries like 'appendectomy' find ICD10PCS/CM
                  equivalents even when the literal term isn't in the target vocabulary.
              MappingProfile(cross-vocabEquivalents):
                value:
                  query: type 2 diabetes mellitus
                  vocabularies:
                  - SNOMED
                  - ICD10CM
                  top_k: 5
                summary: Mapping profile (cross-vocab equivalents)
                description: Use the `mapping` profile to find equivalent codes across vocabularies. Pass
                  `?profile=mapping` as a query-string param alongside this body.
              Query-string-only(q+Profile):
                value: {}
                summary: Query-string-only (q + profile)
                description: Minimal request using only query-string params. The body can be empty when
                  `q` is supplied. Equivalent to the `mapping` example above but without a body.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SearchOMOPConceptRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SearchOMOPConceptRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOMOPVocabularyResponse'
          description: Search results with metadata
        '400':
          description: Invalid request parameters (missing query, invalid search_mode, invalid vocabularies,
            invalid domain, or top_k out of range)
        '401':
          description: Invalid or missing authentication. Provide either Authorization header (Bearer
            token) or X-API-Key header.
        '500':
          description: Internal server error during search
  /api/v1/search/domains/:
    get:
      operationId: v1_search_domains_retrieve
      description: 'Returns list of all supported OMOP domains available for concept search.


        **Supports both JWT (Authorization: Bearer) and API key (X-API-Key) authentication.**'
      summary: List supported domains
      parameters:
      - in: query
        name: response_format
        schema:
          type: string
          enum:
          - json
          - llm
          default: json
        description: Response format. 'json' (default) returns structured JSON. 'llm' returns compact
          markdown tables (text/markdown) optimized for LLM consumption. When 'llm', the response body
          is markdown text rather than the JSON schema shown below.
      tags:
      - Vocabulary
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedDomainsResponse'
          description: Supported domains
        '401':
          description: Invalid or missing authentication. Provide either Authorization header (Bearer
            token) or X-API-Key header.
  /api/v1/search/vocabularies/:
    get:
      operationId: v1_search_vocabularies_retrieve
      description: 'Returns lists of all supported medical vocabularies (ICD10, SNOMED, CPT4, etc.) and
        domains (Condition, Procedure, Drug, etc.) available for OMOP concept search.


        **Supports both JWT (Authorization: Bearer) and API key (X-API-Key) authentication.**'
      summary: List supported vocabularies
      parameters:
      - in: query
        name: response_format
        schema:
          type: string
          enum:
          - json
          - llm
          default: json
        description: Response format. 'json' (default) returns structured JSON. 'llm' returns compact
          markdown tables (text/markdown) optimized for LLM consumption. When 'llm', the response body
          is markdown text rather than the JSON schema shown below.
      tags:
      - Vocabulary
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedVocabulariesResponse'
          description: Supported vocabularies and domains
        '401':
          description: Invalid or missing authentication. Provide either Authorization header (Bearer
            token) or X-API-Key header.
components:
  schemas:
    ChatCompletionRequestRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 1
          description: A model id from the registry. External keys may only use models approved for PHI
            traffic.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageRequest'
        max_tokens:
          type: integer
          maximum: 32000
          minimum: 1
          default: 1024
        temperature:
          type: number
          format: double
          nullable: true
        top_p:
          type: number
          format: double
          nullable: true
        stop:
          type: string
          nullable: true
          minLength: 1
        stream:
          type: boolean
          default: false
        redact_only:
          type: boolean
          default: false
          description: Return the model's answer WITHOUT substituting your values back (placeholders remain).
            Required if you want streaming, and useful when the answer is going somewhere that should
            not hold PHI.
        conversation_key:
          type: string
          description: Supply the same value across turns so a given person keeps the same placeholder;
            multi-turn clients resend history and renaming mid-conversation confuses the model.
          maxLength: 200
      required:
      - messages
      - model
    ChatMessageRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/ChatMessageRoleEnum'
        content:
          type: string
          maxLength: 100000
      required:
      - content
      - role
    ChatMessageRoleEnum:
      enum:
      - system
      - user
      - assistant
      type: string
      description: '* `system` - system

        * `user` - user

        * `assistant` - assistant'
    DRGAgentRequestRequest:
      type: object
      description: Request serializer for the DRG AI agent endpoint.
      properties:
        message:
          type: string
          minLength: 1
          description: Natural language clinical text or DRG question (max 20,000 characters)
          maxLength: 20000
        version:
          allOf:
          - $ref: '#/components/schemas/VersionEnum'
          description: 'Optional MS-DRG version hint for the agent


            * `v36` - v36

            * `v37` - v37

            * `v38` - v38

            * `v39` - v39

            * `v40` - v40

            * `v43` - v43'
        deidentified:
          type: boolean
          default: false
          description: Whether the input clinical text has already been de-identified
      required:
      - message
    DRGAgentResponse:
      type: object
      description: Response serializer for the DRG AI agent endpoint.
      properties:
        response:
          type: string
          description: Agent's natural language response
        token_usage:
          type: object
          additionalProperties: {}
          description: Token usage breakdown from the LLM
        response_time_ms:
          type: integer
          description: Response time in milliseconds
      required:
      - response
      - response_time_ms
      - token_usage
    DRGBatchCaseRequest:
      type: object
      description: One case inside a batch submission.
      properties:
        case_ref:
          type: string
          minLength: 1
          description: Your identifier for this case; unique within the batch — results are returned keyed
            on it.
          maxLength: 128
        dx_codes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 10
          description: ICD-10-CM diagnosis codes. First code is principal diagnosis.
          minItems: 1
        pr_codes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 10
          default: []
          description: ICD-10-PCS procedure codes (7 characters each).
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          default: F
        is_alive:
          type: boolean
          default: true
      required:
      - case_ref
      - dx_codes
    DRGBatchRequestRequest:
      type: object
      description: Request serializer for the async batch classification endpoint.
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/DRGBatchCaseRequest'
          description: Up to 1000 cases per submission.
          maxItems: 1000
          minItems: 1
        source_dialect:
          allOf:
          - $ref: '#/components/schemas/SourceDialectEnum'
          default: icd10cm
          description: 'Code dialect of the submitted cases. Only icd10cm is accepted today; WHO ICD-10
            / ICD-11 batches are refused up front rather than mis-grouped.


            * `icd10cm` - icd10cm'
        version:
          allOf:
          - $ref: '#/components/schemas/VersionEnum'
          default: v40
          description: 'MS-DRG version (default: v40, FY 2023)


            * `v36` - v36

            * `v37` - v37

            * `v38` - v38

            * `v39` - v39

            * `v40` - v40

            * `v43` - v43'
      required:
      - cases
    DRGClassifyInput:
      type: object
      description: Serializer for the input echo in DRG classification response.
      properties:
        dx_codes:
          type: array
          items:
            type: string
        pr_codes:
          type: array
          items:
            type: string
        gender:
          type: string
        is_alive:
          type: boolean
      required:
      - dx_codes
      - gender
      - is_alive
      - pr_codes
    DRGClassifyRequestRequest:
      type: object
      description: Request serializer for direct DRG classification endpoint.
      properties:
        dx_codes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 10
          description: ICD-10-CM diagnosis codes. First code is principal diagnosis.
          minItems: 1
        pr_codes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 10
          default: []
          description: ICD-10-PCS procedure codes (7 characters each).
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          default: F
          description: 'Patient gender: "F" (female) or "M" (male)


            * `F` - F

            * `M` - M'
        is_alive:
          type: boolean
          default: true
          description: Whether the patient was discharged alive
        version:
          allOf:
          - $ref: '#/components/schemas/VersionEnum'
          default: v40
          description: 'MS-DRG version (default: v40, FY 2023)


            * `v36` - v36

            * `v37` - v37

            * `v38` - v38

            * `v39` - v39

            * `v40` - v40

            * `v43` - v43'
      required:
      - dx_codes
    DRGClassifyResponse:
      type: object
      description: Response serializer for direct DRG classification endpoint.
      properties:
        primary_drg:
          type: string
          description: Primary DRG code (3-digit string)
        description:
          type: string
          description: DRG description
        mdc:
          type: string
          description: Major Diagnostic Category
        type:
          type: string
          description: 'DRG type: M (Medical) or P (Procedural)'
        all_candidates:
          type: array
          items:
            type: string
          description: All candidate DRG codes
        version:
          type: string
          description: MS-DRG version used
        fiscal_year:
          type: string
          description: Fiscal year for the version
        input:
          allOf:
          - $ref: '#/components/schemas/DRGClassifyInput'
          description: Echo of the input parameters
        response_time_ms:
          type: integer
          description: Response time in milliseconds
      required:
      - all_candidates
      - description
      - fiscal_year
      - input
      - mdc
      - primary_drg
      - response_time_ms
      - type
      - version
    GenderEnum:
      enum:
      - F
      - M
      type: string
      description: '* `F` - F

        * `M` - M'
    OMOPConcept:
      type: object
      properties:
        concept_id:
          type: integer
        concept_name:
          type: string
        concept_code:
          type: string
        vocabulary_id:
          type: string
        concept_class_id:
          type: string
          nullable: true
        similarity:
          type: number
          format: double
          nullable: true
          description: Final relevance score from cross-encoder reranking (both modes).
        graph_score:
          type: number
          format: double
          nullable: true
          description: Normalised graph-proximity score in [0, 1]. Present only when search_mode=graph.
        combined_score:
          type: number
          format: double
          nullable: true
          description: Deprecated alias of `graph_score` — the two are always equal. Kept so existing
            graph-mode callers do not break. This field once documented a weighted graph/text blend that
            the code never computed; read `graph_score` for the graph signal and `score` for the cross-encoder
            relevance. Present only when search_mode=graph.
        score:
          type: number
          format: double
          nullable: true
          description: Alias for similarity after rerank. Present only when search_mode=graph.
        is_bridge:
          type: boolean
          description: Present and True when this concept is a 2-hop Maps-to bridge (typically a SNOMED
            standard concept) surfaced via include_bridges=True. Absent on direct matches and translated
            in-vocab equivalents.
        parents:
          type: array
          items:
            $ref: '#/components/schemas/ParentConcept'
          nullable: true
      required:
      - concept_class_id
      - concept_code
      - concept_id
      - concept_name
      - vocabulary_id
    ParentConcept:
      type: object
      properties:
        parent_concept_id:
          type: integer
        parent_concept_code:
          type: string
        parent_concept_name:
          type: string
      required:
      - parent_concept_code
      - parent_concept_id
      - parent_concept_name
    RedactRequestRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: Free text to redact. PHI is replaced with indexed placeholders.
          maxLength: 100000
        prior_mapping:
          type: object
          additionalProperties:
            type: string
          description: 'Optional, and the preferred way to keep placeholders stable. Send back the `mapping`
            a previous call returned: a value already in it keeps its placeholder, and a new value gets
            the next free one. Supersedes `conversation_key`: if you send both, this one is used.'
        conversation_key:
          type: string
          description: Deprecated in favour of `prior_mapping`. Supply the same value across related calls
            and the same source value keeps the same placeholder. It does this by deriving the placeholder
            from the source value itself, which makes the placeholder a code derived from information
            about the individual, and which cannot detect a collision across separate calls. Prefer `prior_mapping`.
          maxLength: 200
        return_mapping:
          type: boolean
          default: true
          description: Whether to return the placeholder→original mapping. The mapping is never stored
            server-side; set false if you only need redacted text and do not intend to re-identify.
      required:
      - text
    RedactResponse:
      type: object
      description: Documents the response shape for the schema; not used for validation.
      properties:
        redacted_text:
          type: string
        mapping:
          type: object
          additionalProperties:
            type: string
          description: 'placeholder → original value. Returned to YOU and never persisted by us: you own
            re-identification. Omitted when return_mapping=false.'
        entities_redacted:
          type: object
          additionalProperties:
            type: integer
        redaction_receipt:
          type: object
          additionalProperties: {}
      required:
      - entities_redacted
      - mapping
      - redacted_text
      - redaction_receipt
    SearchFTSOptionsMetadata:
      type: object
      properties:
        search_type:
          type: string
          description: 'FTS search type used: ''plain'', ''phrase'', ''raw'', or ''websearch''.'
        language:
          type: string
          description: PostgreSQL text search configuration used (e.g., 'english').
        use_search_rank:
          type: boolean
          description: Whether SearchRank ordering was applied.
        rank_normalization:
          type: integer
          description: SearchRank normalization flags used (0-31).
      required:
      - language
      - rank_normalization
      - search_type
      - use_search_rank
    SearchMetadata:
      type: object
      properties:
        query:
          type: string
          description: The query string that was searched.
        vocabularies_searched:
          type: array
          items:
            type: string
          description: Vocabularies actually searched (normalized to DB casing).
        domain_id:
          type: string
          nullable: true
          description: Domain filter applied, or null if no domain filter.
        total_results:
          type: integer
          description: Number of results returned in this response.
        find_relationship:
          type: boolean
          description: Whether 'Is a' parent relationships were fetched.
        search_mode:
          allOf:
          - $ref: '#/components/schemas/SearchModeEnum'
          description: 'Effective search mode used. May differ from `requested_search_mode` when graph
            mode fell back to hybrid — see `fallback_reason`.


            * `hybrid` - hybrid

            * `graph` - graph'
        requested_search_mode:
          allOf:
          - $ref: '#/components/schemas/SearchModeEnum'
          description: 'Search mode the caller asked for (before any fallback).


            * `hybrid` - hybrid

            * `graph` - graph'
        profile:
          type: string
          nullable: true
          description: Profile preset applied, or null if no profile was requested.
        include_bridges:
          type: boolean
          description: Whether SNOMED bridge concepts were surfaced (graph mode).
        filter_to_input_vocab:
          type: boolean
          description: Whether results were post-filtered to the requested vocabularies (graph mode).
        fts_options:
          allOf:
          - $ref: '#/components/schemas/SearchFTSOptionsMetadata'
          description: Full-text-search options that were applied.
        fallback_reason:
          type: string
          description: Present only when `search_mode != requested_search_mode`. Explains why graph mode
            fell back to hybrid (e.g., no anchors, low-quality rerank, empty graph expansion).
      required:
      - domain_id
      - filter_to_input_vocab
      - find_relationship
      - fts_options
      - include_bridges
      - profile
      - query
      - requested_search_mode
      - search_mode
      - total_results
      - vocabularies_searched
    SearchModeEnum:
      enum:
      - hybrid
      - graph
      type: string
      description: '* `hybrid` - hybrid

        * `graph` - graph'
    SearchOMOPConceptRequestRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Search query (e.g., 'diabetes', 'appendectomy')
        vocabularies:
          type: array
          items:
            type: string
            minLength: 1
          description: List of vocabularies to search (e.g., ['ICD10', 'SNOMED']). If not provided, searches
            all.
        domain_id:
          type: string
          minLength: 1
          description: Filter by domain (e.g., 'Condition', 'Procedure')
        top_k:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          description: Number of results to return (1-100)
        find_relationship:
          type: boolean
          default: false
          description: If true, fetch 'Is a' relationships (parent concepts) for each result
        relationship_filters:
          type: object
          additionalProperties: {}
          description: 'Additional filters for ConceptRelationship query. Allowed keys: concept_id_2__concept_class_id,
            concept_id_2__concept_class_id__in, concept_id_2__vocabulary_id, concept_id_2__vocabulary_id__in,
            concept_id_2__domain_id, concept_id_2__domain_id__in'
        search_type:
          allOf:
          - $ref: '#/components/schemas/SearchTypeEnum'
          default: websearch
          description: 'FTS search type: plain (simple word match), phrase (exact phrase), raw (tsquery
            syntax), websearch (web-style with +/-)


            * `plain` - plain

            * `phrase` - phrase

            * `raw` - raw

            * `websearch` - websearch'
        language:
          type: string
          minLength: 1
          default: english
          description: PostgreSQL text search configuration (e.g., 'english', 'simple', 'french')
        use_search_rank:
          type: boolean
          default: true
          description: Use SearchRank for ordering FTS results by relevance
        rank_normalization:
          type: integer
          default: 0
          description: SearchRank normalization flags (0-31). See PostgreSQL docs for details.
        min_relevance:
          type: number
          format: double
          nullable: true
          default: -2.0
          description: Cross-encoder logit threshold. Results scoring below this are dropped before being
            returned. ms-marco-MiniLM-L-6-v2 produces logits roughly in [-15, +15]; ~0 is the irrelevant/relevant
            boundary. Default -2.0 is permissive but blocks the 'no good match anywhere' case. Pass null
            to disable filtering and always return up to top_k results regardless of quality.
        include_bridges:
          type: boolean
          default: false
          description: 'Graph mode only. When True, surface the SNOMED-style standard ''bridge'' concepts
            used for 2-hop Maps-to traversal (each marked `is_bridge: true` in the response). Useful for
            showing the user *why* a non-standard code was suggested. Default False.'
        filter_to_input_vocab:
          type: boolean
          default: true
          description: Graph mode only. When True (default), restrict results to the vocabularies in the
            `vocabularies` filter. Set False to allow cross-vocab graph neighbors (e.g. for an LLM-agent
            profile).
      required:
      - query
    SearchOMOPVocabularyResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/OMOPConcept'
        metadata:
          $ref: '#/components/schemas/SearchMetadata'
      required:
      - metadata
      - results
    SearchTypeEnum:
      enum:
      - plain
      - phrase
      - raw
      - websearch
      type: string
      description: '* `plain` - plain

        * `phrase` - phrase

        * `raw` - raw

        * `websearch` - websearch'
    SourceDialectEnum:
      enum:
      - icd10cm
      type: string
      description: '* `icd10cm` - icd10cm'
    SupportedDomainsResponse:
      type: object
      properties:
        domains:
          type: array
          items:
            type: string
      required:
      - domains
    SupportedVocabulariesResponse:
      type: object
      properties:
        vocabularies:
          type: array
          items:
            type: string
        domains:
          type: array
          items:
            type: string
      required:
      - domains
      - vocabularies
    VersionEnum:
      enum:
      - v36
      - v37
      - v38
      - v39
      - v40
      - v43
      type: string
      description: '* `v36` - v36

        * `v37` - v37

        * `v38` - v38

        * `v39` - v39

        * `v40` - v40

        * `v43` - v43'
  securitySchemes:
    api_key_auth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for organization authentication. Obtain from the organization settings or API
        key management endpoint.
    gateway_bearer_auth:
      type: http
      scheme: bearer
      description: Your hpx_ API key as a Bearer token, so OpenAI-compatible SDKs work unmodified. X-API-Key
        and first-party JWTs are also accepted.
    jwt_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /login/ endpoint
tags:
- name: DRG
  description: MS-DRG classification from coded input, free clinical text, or FHIR.
- name: Vocabulary
  description: OMOP concept search, coding, translation and hierarchy resolution.
- name: Gateway
  description: PHI-safe LLM access. Text is redacted before any model sees it and re-hydrated in the answer,
    and every response carries a receipt.
servers:
- url: https://api.v2.healthproximate.com
