  securitySchemes:
    api_key_auth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for organization authentication. Obtain from the organization settings or API
        key management endpoint.
    gateway_bearer_auth:
      type: http
      scheme: bearer
      description: Your hpx_ API key as a Bearer token, so OpenAI-compatible SDKs work unmodified. X-API-Key
        is also accepted. A signed-in user's JWT is refused unless the user is a superuser.
    jwt_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /login/ endpoint
tags:
- name: DRG
  description: MS-DRG classification from coded input, free clinical text, or FHIR.
- name: FHIR Terminology
  description: FHIR R4 CodeSystem, ValueSet and ConceptMap operations over the OMOP vocabularies.
- name: Vocabulary
  description: OMOP concept search, coding, translation and hierarchy resolution.
- name: Gateway
  description: PHI-safe LLM access. Text is redacted before any model sees it and re-hydrated in the answer,
    and every response carries a receipt.
- name: Account
  description: Your own API usage and cost. Readable with any credential, including a key with no scopes
    — billing transparency is not a privilege to withhold. A key sees the requests made with that key;
    a dashboard session sees the requests made in the dashboard.
servers:
- url: https://api.v2.healthproximate.com
