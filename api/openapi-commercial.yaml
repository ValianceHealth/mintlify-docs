            id is not applied). The model is trained on all of your organization''s claims: an input conditions
            it, it does not restrict it to one insurer''s claims. Only a model answer uses inputs, so
            it is `[]` for an own-history figure, for `insufficient_data` and for every key that is not
            payor-bound.'
