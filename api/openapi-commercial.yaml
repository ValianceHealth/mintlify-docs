        | 200 | Done: the same result `Bundle` a synchronous call returns. |

        | 503 | The run failed: an `OperationOutcome`. The same `Idempotency-Key` returns this failed
        job again, so retry with a new one. |

        | 410 | The result expired. Results are kept 7 days, then purged. |

        | 404 | No such job, or it belongs to another organization (indistinguishable on purpose). |


        See [Asynchronous Request Patterns](https://hl7.org/fhir/R4/async.html). Send `Authorization:
        Bearer <token>`, where the token is a Healthproximate JWT or an `hpx_` API key with the `vocabulary`
        scope.


