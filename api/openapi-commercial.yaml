  /api/v1/mcp/:
    post:
      operationId: v1_mcp_create
      description: 'One JSON-RPC 2.0 message per POST, answered as `application/json`. MCP `2026-07-28`
        (version, client and capabilities in `params._meta` and the `MCP-Protocol-Version` header): `server/discover`,
        `tools/list`, `tools/call`. Legacy clients (`2025-11-25` and earlier) open with `initialize`.
        A version the server does not speak is a 400 with JSON-RPC error `-32022` listing `supported`
        and `requested`. No SSE and no session; GET is 405. A present `Origin` that is not ours is a 403
        `origin_not_allowed`. Needs an API key with the `mcp` scope, or an Entra ID access token with
        the `access_as_user` scope from a tenant set up for SSO (401 with a `code` otherwise), on an organization
        with the `mcp_server` flag (403 `feature_not_enabled` otherwise). A notification (no `id`) is
        answered 202. Each key, or each Entra user per tenant, may make 60 calls a minute.'
      summary: MCP server (Streamable HTTP, stateless JSON mode)
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - method
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                id:
                  oneOf:
                  - type: string
                  - type: integer
                  description: Omit for a notification (answered 202, no body).
                method:
                  type: string
                  enum:
                  - initialize
                  - server/discover
                  - ping
                  - tools/list
                  - tools/call
                  description: Any other method is error `-32601`.
                params:
                  type: object
                  description: '`tools/call` takes `name` and `arguments`; `initialize` takes `protocolVersion`,
                    `capabilities` and `clientInfo`.'
            examples:
              Tools/call:
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: tools/call
                  params:
                    name: classify_drg
                    arguments:
                      dx_codes:
                      - I21.09
                      gender: M
                summary: tools/call
      security:
      - entra_bearer_auth: []
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - jsonrpc
                - id
                properties:
                  jsonrpc:
                    type: string
                    enum:
                    - '2.0'
                  id:
                    oneOf:
                    - type: string
                    - type: integer
                    nullable: true
                  result:
                    type: object
                    description: '`tools/call`: `content` (one text block) and `isError`. `tools/list`:
                      `tools`, each with `name`, `description` and `inputSchema`.'
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: integer
                        description: '`-32700` parse error and `-32600` invalid request (HTTP 400); `-32601`
                          method not found and `-32602` invalid params or unknown tool (HTTP 200).'
                      message:
                        type: string
              examples:
                Tools/callResult:
                  value:
                    jsonrpc: '2.0'
                    id: 1
                    result:
                      content:
                      - type: text
                        text: '...'
                      isError: false
                  summary: tools/call result
                MethodNotFound:
                  value:
                    jsonrpc: '2.0'
                    id: 2
                    error:
                      code: -32601
                      message: Method not found
                  summary: Method not found
          description: A JSON-RPC result or error.
        '202':
          description: A notification was accepted.
        '400':
          content:
            application/json:
              schema:
                type: object
                required:
                - jsonrpc
                - id
                properties:
                  jsonrpc:
                    type: string
                    enum:
                    - '2.0'
                  id:
                    oneOf:
                    - type: string
                    - type: integer
                    nullable: true
                  result:
                    type: object
                    description: '`tools/call`: `content` (one text block) and `isError`. `tools/list`:
                      `tools`, each with `name`, `description` and `inputSchema`.'
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: integer
                        description: '`-32700` parse error and `-32600` invalid request (HTTP 400); `-32601`
                          method not found and `-32602` invalid params or unknown tool (HTTP 200).'
                      message:
                        type: string
              examples:
                ParseError:
                  value:
                    jsonrpc: '2.0'
                    id: null
                    error:
                      code: -32700
                      message: Parse error
                  summary: Parse error
          description: Parse error (-32700), invalid request (-32600), invalid params (-32602), header
            mismatch (-32020) or unsupported protocol version (-32022).
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  code:
                    type: string
          description: 'No credential, or an Entra token refused (`code`: invalid_token, expired, bad_audience,
            bad_issuer, missing_scope, wrong_tenant, no_matching_user).'
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  code:
                    type: string
              examples:
                FlagOff:
                  value:
                    detail: The MCP server is not enabled for this organization.
                    code: feature_not_enabled
                  summary: Flag off
          description: '`feature_not_enabled` (flag off) or `permission_denied` (the key lacks the `mcp`
            scope, or `view_as` names an organization the credential cannot act as) or `origin_not_allowed`
            (a present `Origin` that may not call).'
        '429':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  code:
                    type: string
          description: Over 60 calls a minute for this key or Entra user.
        '404':
          description: A `2026-07-28` request for a method the server does not serve (-32601).
  /api/v1/omop/code/:
