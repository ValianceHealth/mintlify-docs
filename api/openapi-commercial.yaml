openapi: 3.0.3
info:
  title: Healthproximate API
  version: 1.0.0
  description: 'DRG classification, OMOP vocabulary services and a PHI-safe LLM gateway.


    Generated by `manage.py export_commercial_openapi` from an explicit operation allowlist (`app/openapi_commercial.py`).
    An endpoint appears here because someone published it, never because it exists.'
  contact:
    email: admin@valiancehealth.ai
paths:
  /api/v1/drg/agent/:
    post:
      operationId: v1_drg_agent_create
      description: "\nUse an AI agent to classify hospital encounters into MS-DRG codes from\nnatural\
        \ language clinical text. The agent can extract ICD-10 codes from\nclinical descriptions and explain\
        \ DRG assignments.\n\n**LLM cost:** ~$0.01-0.05 per request (uses Claude Sonnet via AWS Bedrock).\n\
        \nFor structured ICD-10 code input, use the `/api/v1/drg/classify/` endpoint instead ($0 cost).\n\
        \    "
      summary: AI agent for DRG classification from clinical text
      tags:
      - DRG
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DRGAgentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DRGAgentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DRGAgentRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DRGAgentResponse'
              examples:
                HIVDiagnosis:
                  value:
                    response: Based on the diagnosis code B20 (HIV disease), this classifies to **DRG
                      977** - HIV WITH RELATED CONDITION...
                    token_usage:
                      input_tokens: 1520
                      output_tokens: 340
                    response_time_ms: 3200
                  summary: HIV Diagnosis
          description: Agent response with DRG classification
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: '`view_as` names an organization the caller may not act as'
        '500':
          description: Internal server error
        '503':
          description: 'De-identification failed — request refused before any model (`code`: `deidentification_failed_closed`)'
  /api/v1/drg/batch/:
    post:
      operationId: v1_drg_batch_create
      description: "\nSubmit up to 1000 cases in one call; classification runs asynchronously.\nReturns\
        \ a job id immediately — poll `GET /api/v1/drg/batch/{job_id}/` for\nstatus and progressive per-case\
        \ results.\n\n**Idempotency-Key header is required.** Retrying a submission with the same\nkey\
        \ returns the same job (HTTP 200 instead of 201) and never re-processes or\nre-bills — safe to\
        \ retry on any network failure. A key is per client: the same\nAPI key, or the same login. A key\
        \ another client of your organization already\nused answers 409 `idempotency_key_in_use` and returns\
        \ nothing of theirs.\n\nEach case: `case_ref` (your identifier, unique within the batch), `dx_codes`\n\
        (ICD-10-CM, primary first), optional `pr_codes` (ICD-10-PCS), `gender`,\n`is_alive`. `source_dialect`\
        \ currently accepts `icd10cm` only — WHO ICD-10 /\nICD-11 batches are refused up front rather\
        \ than mis-grouped.\n\nBilling: one ledger row per case (`service_type=\"drg_batch\"`), written\
        \ exactly\nonce even across worker retries. A spend-capped organization's submission is\nrefused\
        \ at enqueue with a 429 and costs nothing.\n    "
      summary: Submit a batch of coded cases for DRG classification
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Caller-chosen key (8-128 chars) making the submission retry-safe.
        required: true
      tags:
      - DRG
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DRGBatchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DRGBatchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DRGBatchRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '201':
          description: Job created
        '200':
          description: Idempotent replay — existing job returned
        '409':
          description: '`idempotency_key_in_use`: another client of the organization already used this
            Idempotency-Key'
        '400':
          description: Invalid request, unsupported dialect, or missing Idempotency-Key
        '401':
          description: Authentication required
        '403':
          description: '`view_as` names an organization the caller may not act as'
        '429':
          description: Batch rate limit, monthly limit, or spend cap reached
  /api/v1/drg/batch/{job_id}/:
    get:
      operationId: v1_drg_batch_retrieve
      description: "\nStatus of a batch job with per-case results as they complete. Poll this —\na job\
        \ in `queued`/`running` will keep gaining `done`/`failed` cases; terminal\njob states are `done`\
        \ (at least one case succeeded), `failed` (every case\nfailed), and `parked` (the organization\
        \ hit its spend limit; the job resumes\nautomatically when the limit clears).\n\nCase results\
        \ carry your `case_ref`, so you can join them back to your\nrecords. Failed cases carry an `error`\
        \ string; they were not billed as\nsuccessful classifications.\n    "
      summary: Batch job status and progressive results
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - DRG
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          description: Job status
        '401':
          description: Authentication required
        '403':
          description: '`view_as` names an organization the caller may not act as'
        '404':
          description: No such job in your organization
  /api/v1/drg/classify/:
    post:
      operationId: v1_drg_classify_create
      description: "\nClassify ICD-10-CM diagnosis codes and ICD-10-PCS procedure codes into an MS-DRG\
        \ code\nusing the vhdrg classification engine.\n\n**No LLM cost** — this endpoint uses deterministic\
        \ rule-based classification.\n\nSupported MS-DRG versions: v36 (FY2019) through v40 (FY2023),\
        \ and v43 (FY2026).\nCMS grouper data for v41/v42 is not shipped by the vhdrg engine.\n    "
      summary: Classify ICD-10 codes into MS-DRG
      tags:
      - DRG
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DRGClassifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DRGClassifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DRGClassifyRequestRequest'
        required: true
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DRGClassifyResponse'
              examples:
                SimplePneumonia:
                  value:
                    primary_drg: '195'
                    description: SIMPLE PNEUMONIA AND PLEURISY WITHOUT CC/MCC
                    mdc: '04'
                    type: M
                    all_candidates:
                    - '195'
                    - '000'
                    version: v40
                    fiscal_year: FY 2023
                    input:
                      dx_codes:
                      - J189
                      - J310
                      gender: F
                      is_alive: true
                      pr_codes: []
                    response_time_ms: 12
                  summary: Simple Pneumonia
          description: DRG classification result
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: '`view_as` names an organization the caller may not act as'
        '500':
          description: Internal server error
  /api/v1/fhir/$autocode:
    post:
      operationId: v1_fhir_autocode
      description: 'Send a FHIR R4 `Bundle` of one case and get back a **provisional** coding

        of it. The notes go in as `DocumentReference` (plain text); the Bundle also takes

        a `Patient` (required; the first one is used), `ChargeItem`, `Condition` and

        `Encounter`. Resource ids are echoed back and are seen by the coding model, so

        use opaque ids (never a name or a medical record number).


        The result is a `Bundle` of provisional `Condition` (ICD-10-CM, plus SNOMED CT when

        an equivalent exists) and `Procedure` (ICD-10-PCS) resources, the `ChargeItem`s you

        sent echoed by id (whitelisted fields only; an RxNorm or SNOMED CT coding is added

        when matched), an `Encounter` carrying the diagnosis ranks, and an

        `OperationOutcome` listing queries and items that were withheld (severity

        `warning`, code `incomplete`). Each coding carries `autocode-confidence` and

        `autocode-evidence` extensions. `Bundle.meta.tag` carries the redaction receipt.

        Every `subject` references `Patient/patient`, which is not in the result Bundle:

        map it to your own patient. A withheld item names its code in `diagnostics`.

        CPT and HCPCS are never returned. A coder reviews every result; nothing is final.


        **Redaction.** Names and identifiers are redacted before any model sees the text.

        If redaction fails, nothing is processed and the answer is 503, its issue''s

        `details.coding[0].code` `redaction_failed_closed`: a code of ours, with no `system`

        (`Coding.system` is optional in FHIR R4).


        **Limits.** Body at most 2,000,000 bytes, notes at most 50,000 characters in total,

        at most 500 `ChargeItem` and 600 Bundle entries (400, code `too-long`). An invalid

        Bundle, no notes or no `Patient` is 400, code `invalid`.


        **Async.** Add `Prefer: respond-async` and an `Idempotency-Key` (8-119 characters)

        to get `202 Accepted` with `Content-Location: /api/v1/fhir/autocode-jobs/{job id}` and `Retry-After:
        5`,

        then poll that URL (see the status operation). The same key returns the same job,

        a failed one included: to retry a failed job, submit with a new `Idempotency-Key`.

        See [Asynchronous Request Patterns](https://hl7.org/fhir/R4/async.html).


        **Access.** An external, non-superuser API key with both the `autocode` and

        `vocabulary` scopes, on an organization with the `fhir_autocode` flag. Send `Authorization: Bearer
        <token>`, where the token is a Healthproximate JWT or an `hpx_` API key with the `vocabulary`
        scope.


        **Billing.** One flat per-case price, charged on a 200 only. 4xx, 429, 503 and the

        202 submit are free. A spend-cap refusal is a 429 `OperationOutcome` (code

        `throttled`); a rate or monthly limit is a 429 too, with a plain JSON body. 503 means "retry later":
        redaction

        failed, the coder gave no structured answer, it timed out, or a model or code table

        was unavailable.


        **Scoping.** The acting organization is the API key''s own: a key is bound to

        one organization, so this is a gate on that organization (the `fhir_autocode`

        flag and the `autocode` and `vocabulary` scopes), not a filter. The request reads

        no tenant data and the result is built only from the Bundle you send. A JWT

        caller, a key missing the `vocabulary` scope or an organization without the flag

        gets a 403 `OperationOutcome` (a 403 stays a 403 on `/api/v1/`). A key missing

        the `autocode` scope gets the key layer''s own 403.


        **FHIR R4 spec:** [Bundle](https://hl7.org/fhir/R4/bundle.html) · [DocumentReference](https://hl7.org/fhir/R4/documentreference.html)
        · [ChargeItem](https://hl7.org/fhir/R4/chargeitem.html) · [Condition](https://hl7.org/fhir/R4/condition.html)
        · [Procedure](https://hl7.org/fhir/R4/procedure.html) · [Encounter](https://hl7.org/fhir/R4/encounter.html)
        · [OperationOutcome](https://hl7.org/fhir/R4/operationoutcome.html) · [Asynchronous Request Patterns](https://hl7.org/fhir/R4/async.html)'
      summary: Code a clinical case from notes and charges ($autocode)
      externalDocs:
        url: https://hl7.org/fhir/R4/bundle.html
        description: 'HL7 FHIR R4: Bundle'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Required with `Prefer: respond-async`; 8-119 characters.'
      - in: header
        name: Prefer
        schema:
          type: string
        description: '`respond-async` to submit a job instead of waiting.'
      tags:
      - FHIR Terminology
      requestBody:
        content:
          application/fhir+json:
            schema:
              type: object
              additionalProperties: {}
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: Bundle
                    type: collection
                    meta:
                      tag:
                      - system: https://valiancehealth.ai/fhir/redaction
                        code: presidio
                        display: 1 entities redacted
                    entry:
                    - fullUrl: urn:uuid:78c3cb91-6949-536d-85e2-a69572991c45
                      resource:
                        resourceType: Condition
                        id: dx-0
                        clinicalStatus:
                          coding:
                          - system: http://terminology.hl7.org/CodeSystem/condition-clinical
                            code: active
                        verificationStatus:
                          coding:
                          - system: http://terminology.hl7.org/CodeSystem/condition-ver-status
                            code: provisional
                        code:
                          coding:
                          - system: http://hl7.org/fhir/sid/icd-10-cm
                            code: K35.32
                            userSelected: false
                            extension:
                            - url: https://valiancehealth.ai/fhir/StructureDefinition/autocode-confidence
                              valueDecimal: 0.9
                            - url: https://valiancehealth.ai/fhir/StructureDefinition/autocode-evidence
                              valueString: perforated appendix
                        subject:
                          reference: Patient/patient
                    - fullUrl: urn:uuid:7103efdf-c659-58af-b780-886409f6da52
                      resource:
                        resourceType: Procedure
                        id: px-0
                        status: unknown
                        code:
                          coding:
                          - system: http://www.cms.gov/Medicare/Coding/ICD10
                            code: 0DTJ4ZZ
                            userSelected: false
                        subject:
                          reference: Patient/patient
                    - fullUrl: urn:uuid:c3ba07fc-b763-591c-872f-c6c3fe40b438
                      resource:
                        resourceType: OperationOutcome
                        id: queries
                        issue:
                        - severity: warning
                          code: incomplete
                          diagnostics: Was the perforation documented before surgery?
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: Bundle
                    type: collection
                    meta:
                      tag:
                      - system: https://valiancehealth.ai/fhir/redaction
                        code: presidio
                        display: 1 entities redacted
                    entry:
                    - fullUrl: urn:uuid:78c3cb91-6949-536d-85e2-a69572991c45
                      resource:
                        resourceType: Condition
                        id: dx-0
                        clinicalStatus:
                          coding:
                          - system: http://terminology.hl7.org/CodeSystem/condition-clinical
                            code: active
                        verificationStatus:
                          coding:
                          - system: http://terminology.hl7.org/CodeSystem/condition-ver-status
                            code: provisional
                        code:
                          coding:
                          - system: http://hl7.org/fhir/sid/icd-10-cm
                            code: K35.32
                            userSelected: false
                            extension:
                            - url: https://valiancehealth.ai/fhir/StructureDefinition/autocode-confidence
                              valueDecimal: 0.9
                            - url: https://valiancehealth.ai/fhir/StructureDefinition/autocode-evidence
                              valueString: perforated appendix
                        subject:
                          reference: Patient/patient
                    - fullUrl: urn:uuid:7103efdf-c659-58af-b780-886409f6da52
                      resource:
                        resourceType: Procedure
                        id: px-0
                        status: unknown
                        code:
                          coding:
                          - system: http://www.cms.gov/Medicare/Coding/ICD10
                            code: 0DTJ4ZZ
                            userSelected: false
                        subject:
                          reference: Patient/patient
                    - fullUrl: urn:uuid:c3ba07fc-b763-591c-872f-c6c3fe40b438
                      resource:
                        resourceType: OperationOutcome
                        id: queries
                        issue:
                        - severity: warning
                          code: incomplete
                          diagnostics: Was the perforation documented before surgery?
          description: FHIR R4 resource (application/fhir+json)
        '400':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: invalid
                      diagnostics: the Bundle has no clinical notes
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: invalid
                      diagnostics: the Bundle has no clinical notes
          description: 'OperationOutcome: Invalid Bundle, no notes, no Patient, a missing or malformed
            Idempotency-Key, or a limit exceeded (code `too-long`)'
        '403':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: forbidden
                      diagnostics: $autocode is not enabled for this organization
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: forbidden
                      diagnostics: $autocode is not enabled for this organization
          description: 'OperationOutcome: `view_as` names an organization the caller may not act as (checked
            first), not an API key, an internal or superuser key, a missing `vocabulary` scope, or `fhir_autocode`
            is off for the organization'
        '429':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: throttled
                      diagnostics: spend limit reached
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: throttled
                      diagnostics: spend limit reached
          description: 'OperationOutcome: The organization''s spend limit is reached (this body, code
            `throttled`). A rate or monthly limit is also 429, refused before the operation runs, with
            a plain JSON body instead'
        '503':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: transient
                      diagnostics: auto-coding is temporarily unavailable
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: transient
                      diagnostics: auto-coding is temporarily unavailable
          description: 'OperationOutcome: Redaction failed, or the coder is unavailable. Retry later;
            not billed'
        '202':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Accepted (only with `Prefer: respond-async`). Empty body; poll `Content-Location`
            (`/api/v1/fhir/autocode-jobs/{job id}`) every `Retry-After` seconds.'
        '401':
          description: No or invalid credentials
  /api/v1/fhir/$classify-drg:
    post:
      operationId: v1_fhir_classify_drg_create
      description: '

        FHIR front door for the deterministic DRG classifier. Send a Bundle containing

        the encounter''s `Condition` resources (ICD-10-CM codings; principal marked via

        `Encounter.diagnosis` rank 1, else first-listed), optional `Procedure`

        resources (ICD-10-PCS codings), a minimal `Patient` (only `gender` is read),

        and optionally an `Encounter` (`hospitalization.dischargeDisposition` maps to

        discharge status).


        **Patient identifiers are dropped at the boundary** — names, identifiers,

        addresses and telecom are never read and never stored; the response attests

        this with `fhir_identifiers_dropped`. The submitted Bundle is not persisted.


        Returns a FHIR `Parameters` resource carrying the DRG code, description and

        grouper version. Malformed or unclassifiable input returns an

        `OperationOutcome` — never a partial result.


        Served at `/api/v1/fhir/$classify-drg` and, for existing callers,

        `/api/v1/fhir/drg/$classify`. Needs the `drg:classify` key scope.


        **FHIR R4 spec:** [Bundle](https://hl7.org/fhir/R4/bundle.html) · [Condition](https://hl7.org/fhir/R4/condition.html)
        · [Procedure](https://hl7.org/fhir/R4/procedure.html) · [Encounter](https://hl7.org/fhir/R4/encounter.html)
        · [Patient](https://hl7.org/fhir/R4/patient.html) · [Parameters](https://hl7.org/fhir/R4/parameters.html)
        · [OperationOutcome](https://hl7.org/fhir/R4/operationoutcome.html)'
      summary: Classify a FHIR R4 Bundle into an MS-DRG ($classify)
      externalDocs:
        url: https://hl7.org/fhir/R4/bundle.html
        description: 'HL7 FHIR R4: Bundle'
      tags:
      - DRG
      requestBody:
        content:
          application/fhir+json:
            schema:
              type: object
              additionalProperties: {}
      security:
      - api_key_auth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: Parameters
                    parameter:
                    - name: drg
                      valueString: '639'
                    - name: description
                      valueString: Diabetes without CC/MCC
                    - name: mdc
                      valueString: '10'
                    - name: grouperVersion
                      valueString: v40
                    - name: fhir_identifiers_dropped
                      valueBoolean: true
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: Parameters
                    parameter:
                    - name: drg
                      valueString: '639'
                    - name: description
                      valueString: Diabetes without CC/MCC
                    - name: mdc
                      valueString: '10'
                    - name: grouperVersion
                      valueString: v40
                    - name: fhir_identifiers_dropped
                      valueBoolean: true
          description: FHIR Parameters with the DRG result
        '400':
          content:
            application/fhir+json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: invalid
                      diagnostics: 'Not a valid FHIR R4 Bundle: 1 validation error(s).'
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Example:
                  value:
                    resourceType: OperationOutcome
                    issue:
                    - severity: error
                      code: invalid
                      diagnostics: 'Not a valid FHIR R4 Bundle: 1 validation error(s).'
          description: OperationOutcome — invalid or unclassifiable Bundle
        '401':
          description: Authentication required
        '403':
          description: The API key lacks the drg:classify scope, or `view_as` names an organization the
            caller may not act as
        '429':
          description: Rate or monthly limit reached
  /api/v1/fhir/CodeSystem/$lookup:
    get:
      operationId: v1_fhir_codesystem_lookup
      description: 'Look up one code: its display name, the loaded version, its English

        synonyms (`designation`) and its direct parent codes (`property` `parent`).


        | Code system | `system` URI |

        |---|---|

        | ICD10CM | `http://hl7.org/fhir/sid/icd-10-cm` |

        | ICD10 | `http://hl7.org/fhir/sid/icd-10` |

        | ICD10PCS | `http://www.cms.gov/Medicare/Coding/ICD10` |

        | ICD9CM | `http://hl7.org/fhir/sid/icd-9-cm` |

        | SNOMED | `http://snomed.info/sct` |


        GET takes query parameters; POST takes a FHIR `Parameters` body (`system` + `code`,

        or one `coding`). An unknown code is a 404 `OperationOutcome`. Send `Authorization: Bearer <token>`,
        where the token is a Healthproximate JWT or an `hpx_` API key with the `vocabulary` scope.


        **FHIR R4 spec:** [CodeSystem $lookup](https://hl7.org/fhir/R4/codesystem-operation-lookup.html)
        · [CodeSystem](https://hl7.org/fhir/R4/codesystem.html) · [Parameters](https://hl7.org/fhir/R4/parameters.html)
        · [OperationOutcome](https://hl7.org/fhir/R4/operationoutcome.html)'
      summary: CodeSystem $lookup (query string)
      externalDocs:
        url: https://hl7.org/fhir/R4/codesystem-operation-lookup.html
        description: 'HL7 FHIR R4: CodeSystem $lookup'
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: The code, dotted or undotted (`E11.9` or `E119`).
        required: true
      - in: query
        name: system
